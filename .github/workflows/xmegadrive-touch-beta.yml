name: Build XMegaDrive Touch Beta

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 3717e683602788033ec96c7649601bb15a66fb05

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Re-run focused XMegaDrive tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest --tests com.webapp.crazyshit.XMegaDriveAgePromptTest

      - name: Build debug beta
        env:
          ZEROCHILL_SOURCE_SHA: 3717e683602788033ec96c7649601bb15a66fb05
          ANALYTICS_ENDPOINT: ""
          SHITTOK_POOL_DIAGNOSTICS: "true"
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename beta
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" ZeroChill-3717e68-XMegaDrive-Native-Touch-Beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-XMegaDrive-Native-Touch-Beta
          path: ZeroChill-3717e68-XMegaDrive-Native-Touch-Beta.apk
          if-no-files-found: error
          retention-days: 7

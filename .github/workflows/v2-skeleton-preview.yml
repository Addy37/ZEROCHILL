name: Build V2 Skeleton Preview

on:
  pull_request:
    paths:
      - "v2preview/**"
      - "settings.gradle.kts"
      - ".github/workflows/v2-skeleton-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build separate V2 debug APK
        run: ./gradlew --no-daemon :v2preview:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZEROCHILL-V2-Skeleton-${{ github.sha }}
          path: v2preview/build/outputs/apk/debug/*.apk
          if-no-files-found: error

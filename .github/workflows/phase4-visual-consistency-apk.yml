name: ZEROCHILL Phase 4 Visual Consistency Preview

# One isolated signed performance candidate; no release or merge.
# Only workflow changes trigger a build automatically.
on:
  push:
    branches:
      - fix/zerochill-phase4-visual-consistency
    paths:
      - .github/workflows/phase4-visual-consistency-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-preview:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: "6000014"
      APP_VERSION_NAME: "7.0.0-visual-preview.12"
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
      # Match the working release workflow. This is the client/anon key, never a service-role key.
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FEEDBACK_ANON_KEY }}
      ANALYTICS_ENDPOINT: ""
      ANALYTICS_V2_ENDPOINT: ""

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 and 36
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Restore existing production signing identity
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              sys.exit("Missing repository signing bundle")
          data = json.loads(raw.replace("\r", "").replace("\n", ""))
          required = ("keystore_base64", "store_password", "key_alias", "key_password")
          if any(not data.get(key) for key in required):
              sys.exit("Signing bundle incomplete")
          for key in ("store_password", "key_alias", "key_password"):
              print("::add-mask::" + data[key])
          keystore = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zerochill-appearance-preview.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_base64"]))
          keystore.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"ANDROID_KEYSTORE_PATH={keystore}\n")
              out.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              out.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              out.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

      - name: Verify public Supabase client configuration
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::Missing publishable Supabase key for signed preview"
            exit 1
          fi

      - name: Focused appearance and navigation regressions and one signed release build
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.AppearanceThemeTest'
          --tests 'com.webapp.crazyshit.AccentCoverageTest'
          --tests 'com.webapp.crazyshit.PreferenceGlassSettingsTest'
          --tests 'com.webapp.crazyshit.PreferenceGlassPanelTest'
          --tests 'com.webapp.crazyshit.ZeroChillComposeMenuTest'
          --tests 'com.webapp.crazyshit.HeaderGlassMaterialTest'
          --tests 'com.webapp.crazyshit.ShowsFullscreenControlsTest'
          --tests 'com.webapp.crazyshit.SearchResultsPolishTest'
          --tests 'com.webapp.crazyshit.SocialMediaTest'
          --tests 'com.webapp.crazyshit.ZeroChillMessageThreadUiTest'
          --tests 'com.webapp.crazyshit.FeedbackConversationTest'
          --tests 'com.webapp.crazyshit.NavigationResponsivenessTest'
          --tests 'com.webapp.crazyshit.NavigationBadgeReadTest'
          --tests 'com.webapp.crazyshit.NotificationNavigationWorkTest'
          --tests 'com.webapp.crazyshit.UpdateInboxStoreTest'
          --tests 'com.webapp.crazyshit.CreatorNameMatcherTest'
          --tests 'com.webapp.crazyshit.CreatorNotificationsTest'
          --tests 'com.webapp.crazyshit.ManualCreatorMergeTest'
          --tests 'com.webapp.crazyshit.NotificationEntryLatencyTest'
          --tests 'com.webapp.crazyshit.NotificationCenterUiTest'
          --tests 'com.webapp.crazyshit.PrimaryTabNavigationTest'
          --tests 'com.webapp.crazyshit.PrimaryTabLibraryTest'
          --tests 'com.webapp.crazyshit.PrimaryTabWorkQueueTest'
          --tests 'com.webapp.crazyshit.PrimaryTabWarmupTest'
          --tests 'com.webapp.crazyshit.NavigationMotionControllerTest'
          --tests 'com.webapp.crazyshit.BottomNavigationInsetsTest'
          --tests 'com.webapp.crazyshit.SearchOverlayTest'
          --tests 'com.webapp.crazyshit.SearchShitTokPauseTest'
          --tests 'com.webapp.crazyshit.ShitTokAudioOwnershipTest'
          --tests 'com.webapp.crazyshit.ShowsWatchPageTest.scopedBackWithMotionEnabledFinishesInSameDispatch'
          --tests 'com.webapp.crazyshit.ShowsWatchPageTest.backExitsDirectlyAfterSelectionsWithoutRelatedHistory'
          --tests 'com.webapp.crazyshit.ShowsWatchMotionTest'
          :app:assembleRelease

      - name: Preserve focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-phase4-visual-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

      - name: Verify production upgrade identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          # Verify the client key reached the actual APK, without printing it.
          python3 - <<'PYKEY'
          import os, zipfile
          key = os.environ["SUPABASE_PUBLISHABLE_KEY"].encode()
          with zipfile.ZipFile("app/build/outputs/apk/release/app-release.apk") as apk:
              assert key and any(key in apk.read(n) for n in apk.namelist() if n.endswith(".dex")), "APK is missing Supabase client key"
          print("APK contains configured Supabase client key")
          PYKEY
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.addy37.crazyshitunofficial'"
          echo "$BADGING" | grep -q "versionCode='6000014'"
          mkdir -p "$RUNNER_TEMP/stable"
          gh release download v6.0.2 --repo "$GITHUB_REPOSITORY" \
            --pattern ZeroChill.apk --dir "$RUNNER_TEMP/stable"
          CANDIDATE_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          STABLE_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/stable/ZeroChill.apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          test -n "$CANDIDATE_CERT"
          test "$CANDIDATE_CERT" = "$STABLE_CERT"
          STABLE_BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$RUNNER_TEMP/stable/ZeroChill.apk")"
          STABLE_CODE="$(echo "$STABLE_BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          test 6000014 -gt "$STABLE_CODE"
          test 6000014 -gt 6000013
          OUT="ZeroChill-Visual-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > SHA256SUMS-visual.txt

      - name: Upload signed upgrade APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-phase4-visual-upgrade
          path: |
            ZeroChill-Visual-*.apk
            SHA256SUMS-visual.txt
          retention-days: 14
          if-no-files-found: error

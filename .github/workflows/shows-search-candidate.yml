name: ZEROCHILL Shows Search Signed Test APK

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: shows-search-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    if: >-
      github.repository == 'Addy37/ZEROCHILL' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/shows-search-accuracy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_VERSION_CODE: '7004001'
      APP_VERSION_NAME: '7.4.1-test.shows-search'
      ZEROCHILL_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      ZEROCHILL_SOURCE_BRANCH: ${{ github.head_ref }}
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify current main and record source lineage
        run: bash tools/verify-android-build-lineage.sh "$RUNNER_TEMP/BUILD_LINEAGE.txt"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Restore production signing credentials
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get('SIGNING_BUNDLE', '')
          if not raw:
              raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data = json.loads(raw.replace('\r','').replace('\n',''))
          for key in ('keystore_base64','store_password','key_alias','key_password'):
              if not data.get(key):
                  raise SystemExit('Missing signing item: ' + key)
          for key in ('store_password','key_alias','key_password'):
              print('::add-mask::' + data[key])
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'shows-search.jks'
          path.write_bytes(base64.b64decode(data['keystore_base64']))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for key, value in {
                  'ANDROID_KEYSTORE_PATH': str(path),
                  'ANDROID_KEYSTORE_PASSWORD': data['store_password'],
                  'ANDROID_KEY_ALIAS': data['key_alias'],
                  'ANDROID_KEY_PASSWORD': data['key_password']
              }.items():
                  out.write(key+'='+value+'\n')
          PY
      - name: Run search and watch tests and assemble the signed test APK
        env:
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:testReleaseUnitTest
          --tests '*Search*Test'
          --tests '*CrazyShit*Test'
          --tests '*Efukt*Test'
          --tests '*WebVideoSourceRepositoryTest'
          --tests '*ShowsWatch*Test'
          :app:assembleRelease
      - name: Verify install upgrade identity and archive the test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate "$RUNNER_TEMP/stable"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern ZeroChill.apk --dir "$RUNNER_TEMP/stable"
          SAFE_REF="${ZEROCHILL_SOURCE_BRANCH//\//-}"
          APK="candidate/ZeroChill-${APP_VERSION_NAME}-${SAFE_REF}-${ZEROCHILL_SOURCE_SHA:0:7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          export CANDIDATE_APK="$APK"
          PYTHONPATH=tools python3 - <<'PY'
          import os, pathlib
          from verify_release_candidate import CERT, PACKAGE, identity
          sdk = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'
          current = identity(os.environ['CANDIDATE_APK'], sdk)
          stable = identity(pathlib.Path(os.environ['RUNNER_TEMP']) / 'stable/ZeroChill.apk', sdk)
          assert current['application_id'] == stable['application_id'] == PACKAGE
          assert current['certificate_sha256'] == stable['certificate_sha256'] == CERT
          assert current['version_name'] == os.environ['APP_VERSION_NAME']
          assert current['version_code'] == int(os.environ['APP_VERSION_CODE'])
          assert current['version_code'] > stable['version_code']
          revision = os.environ['ZEROCHILL_SOURCE_SHA']
          config = pathlib.Path('app/build/generated/source/buildConfig/release/com/webapp/crazyshit/BuildConfig.java')
          assert f'SOURCE_REVISION = "{revision}";' in config.read_text()
          pathlib.Path('candidate/VALIDATION.txt').write_text(
              'Package, production certificate and upgrade version verified. Device approval pending.\n')
          PY
          cp "$RUNNER_TEMP/BUILD_LINEAGE.txt" candidate/
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-Shows-Search-signed-${{ env.ZEROCHILL_SOURCE_SHA }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Sample live metadata search on the base and candidate
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          BASE_SHA="$(sed -n 's/^BASE_SHA=//p' candidate/BUILD_LINEAGE.txt)"
          bash tools/compare-shows-search.sh "$BASE_SHA" | tee "$RUNNER_TEMP/shows-search-sample.txt"

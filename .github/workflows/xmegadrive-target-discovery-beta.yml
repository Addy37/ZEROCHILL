name: Build XMegaDrive Target Discovery Beta

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1a17dc9edfe547ca6fdb845bd94334ac0d7838c6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Verify target discovery fix
        run: |
          grep -q 'NATIVE_AGE_TARGET_DISCOVERY_TIMEOUT_MS = 12000L' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          grep -q 'shadowRoot' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          grep -q 'contentDocument' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'attempt < 3' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'dispatchNativeTap' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'MotionEvent.obtain' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'el.click()' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java

      - name: Run focused XMegaDrive tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest --tests com.webapp.crazyshit.XMegaDriveAgePromptTest

      - name: Build debug beta
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename beta
        run: cp app/build/outputs/apk/debug/app-debug.apk ZeroChill-1a17dc9-XMegaDrive-Target-Discovery-Beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-XMegaDrive-Target-Discovery-Beta
          path: ZeroChill-1a17dc9-XMegaDrive-Target-Discovery-Beta.apk
          retention-days: 7

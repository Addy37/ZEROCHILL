name: Apply XMegaDrive Native Age Prompt

on:
  push:
    branches: [ feature/zerochill-notifications-5.3.0 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/zerochill-notifications-5.3.0
          fetch-depth: 0

      - name: Wire native age prompt into XMegaDrive browser flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once('    private static final long EXTRACTION_RETRY_MS = 800L;\n    private static volatile String sessionUserAgent = "";\n', '    private static final long EXTRACTION_RETRY_MS = 800L;\n    private static final long NATIVE_AGE_FALLBACK_GRACE_MS = 4500L;\n    private static volatile String sessionUserAgent = "";\n', 'fallback grace constant')
          replace_once('            // Read ownership on main: cancellation can race with start() creating the views.\n            main.post(() -> destroy(activeOverlay.getAndSet(null), activeWebView.getAndSet(null)));\n', '            // Read ownership on main: cancellation can race with start() creating the views.\n            main.post(() -> {\n                WebView webView = activeWebView.getAndSet(null);\n                dismissAgePrompt(webView);\n                destroy(activeOverlay.getAndSet(null), webView);\n            });\n', 'final cleanup')
          replace_once('                    // Remove this renderer\'s WebView even if completion already raced with cancel.\n                    destroy(activeOverlay.getAndSet(null), activeWebView.getAndSet(null));\n                    return true;\n', '                    // Remove this renderer\'s WebView even if completion already raced with cancel.\n                    dismissAgePrompt(view);\n                    destroy(activeOverlay.getAndSet(null), activeWebView.getAndSet(null));\n                    return true;\n', 'renderer cleanup')
          replace_once('        if (waiting) {\n            if (needsPerson(titleNow, "")) reveal(overlay, webView);\n', '        if (waiting) {\n            if (needsPerson(titleNow, "")) {\n                XMegaDriveAgePrompt prompt = agePrompt(webView);\n                if (prompt != null) prompt.showRawFallback();\n                reveal(overlay, webView);\n            }\n', 'early human challenge reveal')
          replace_once('                if (needsPerson(title, text)) reveal(overlay, webView);\n', '                if (needsPerson(title, text)) {\n                    XMegaDriveAgePrompt prompt = agePrompt(webView);\n                    if (prompt != null) prompt.showRawFallback();\n                    reveal(overlay, webView);\n                }\n', 'late human challenge reveal')

          old_age = base64.b64decode('').decode()
          new_age = base64.b64decode('').decode()
          replace_once(old_age, new_age, 'age fallback block')

          marker = '    private static boolean needsPerson(String title, String text) {\n'
          if text.count(marker) != 1:
              raise SystemExit(f'helper insertion point: expected one match, found {text.count(marker)}')
          helpers = base64.b64decode('').decode()
          text = text.replace(marker, helpers + marker, 1)
          path.write_text(text)
          PY

      - name: Run focused XMegaDrive tests
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest --tests com.webapp.crazyshit.XMegaDriveAgePromptTest

      - name: Remove one-time patch workflow
        run: git rm .github/workflows/xmegadrive-native-age-prompt-patch.yml

      - name: Commit native XMegaDrive age prompt integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          git commit -m "Use native XMegaDrive age confirmation prompt"
          git push origin HEAD:feature/zerochill-notifications-5.3.0

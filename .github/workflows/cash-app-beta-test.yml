name: Cash App Beta Test APK

on:
  push:
    branches:
      - feature/cash-app-profile-v7
    paths:
      - .github/workflows/cash-app-beta-test.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: "7000005"
      APP_VERSION_NAME: "7.0.5-cashapp-beta"
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ""
      ANALYTICS_V2_ENDPOINT: ""
    steps:
      - name: Check out approved ZEROCHILL 7 source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Restore existing signing identity
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              sys.exit("Missing existing signing bundle")
          data = json.loads(raw.replace("\r", "").replace("\n", ""))
          required = ["keystore_base64", "store_password", "key_alias", "key_password"]
          if any(not data.get(key) for key in required):
              sys.exit("Incomplete signing bundle")
          for key in ("store_password", "key_alias", "key_password"):
              print("::add-mask::" + data[key])
          keyfile = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zerochill-test.jks"
          keyfile.write_bytes(base64.b64decode(data["keystore_base64"]))
          keyfile.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"ANDROID_KEYSTORE_PATH={keyfile}\n")
              out.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              out.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              out.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY
      - name: Run debug tests and build signed side-by-side beta
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify signed beta and identify source
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          grep -q 'https://cash.app/\$SupportZC' app/src/main/java/com/webapp/crazyshit/LandscapeMoreDialog.java
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep "package: name='com.addy37.crazyshitunofficial.dev'"
          OUT="ZeroChill-Beta-cashapp-${GITHUB_SHA:0:7}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > SHA256SUMS-beta.txt
      - name: Upload signed beta APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEROCHILL-7-cashapp-beta-${{ github.sha }}
          path: |
            ZeroChill-Beta-cashapp-*.apk
            SHA256SUMS-beta.txt
          retention-days: 14
          if-no-files-found: error

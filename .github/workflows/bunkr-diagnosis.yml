name: Bunkr metadata diagnosis
on:
  push:
    branches: [fix/bunkr-resolution-artwork-search]
    paths: ['.github/workflows/bunkr-diagnosis.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Inspect reproduction metadata without downloading media
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json
          config=json.load(open('app/src/main/assets/source_config_defaults.json'))['sources']['bunkr']
          address='https://bunkr.cr/f/Fuyd9dOX3ZbhP'
          def fetch(u):
              req=urllib.request.Request(u, headers={'User-Agent':config['userAgent'],'Referer':address})
              with urllib.request.urlopen(req,timeout=15) as r:
                  body=r.read(1024*1024).decode('utf-8',errors='replace')
                  print('URL',r.url,'STATUS',r.status)
                  return body
          for page in [address, address.replace('bunkr.cr','bunkr.fi')]:
              try:
                  body=fetch(page)
                  cdn=re.search(r'jsCDN\s*=\s*["\']([^"\']+)',body).group(1).replace('\\/','/')
                  sign=re.search(r'signUrl\s*=\s*["\']([^"\']+)',body).group(1)
                  path=urllib.parse.unquote(urllib.parse.urlsplit(cdn).path)
                  data=json.loads(fetch(sign+'?path='+urllib.parse.quote(path,safe='')))
                  print('SIGN_FIELDS',sorted(data.keys()))
                  signed=cdn+'?'+urllib.parse.urlencode({'token':data['token'],'ex':data['ex']})
                  for label,headers in [('native',{'Origin':urllib.parse.urlsplit(page).scheme+'://'+urllib.parse.urlsplit(page).netloc,'Referer':page}),('browser',{'Referer':page})]:
                      req=urllib.request.Request(signed,headers={'User-Agent':config['userAgent'],'Range':'bytes=0-31',**headers})
                      try:
                          with urllib.request.urlopen(req,timeout=15) as r:
                              print('STREAM',page,label,r.status,r.headers.get('Content-Type'),r.headers.get('Content-Range'),r.read(32).hex())
                      except Exception as e: print('STREAM_ERROR',page,label,str(e))
              except Exception as e: print('PAGE_ERROR',page,str(e))
          PY

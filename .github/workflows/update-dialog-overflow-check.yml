name: ZEROCHILL update dialogs overflow regression
# Temporary, focused check only. Never build or publish APKs.
on:
  push:
    branches:
      - fix/whats-new-scroll-2026-11
    paths:
      - .github/workflows/update-dialog-overflow-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-whats-new:
    if: github.ref_name == 'fix/whats-new-scroll-2026-11'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      APP_VERSION_CODE: '7000013'
      APP_VERSION_NAME: '7.0.4-whats-new-scroll-test'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Test update popup and What's New overflow in Debug and Release
        run: |
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 \
            :app:testDebugUnitTest :app:testReleaseUnitTest \
            --tests '*WhatsNewTest' \
            --tests '*ReleaseNotesSummaryTest' \
            --tests '*UpdateCardControllerTest' \
            --tests '*UpdateCardOverflowTest'
      - name: Upload focused unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-dialog-overflow-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testReleaseUnitTest/
          retention-days: 7
          if-no-files-found: ignore

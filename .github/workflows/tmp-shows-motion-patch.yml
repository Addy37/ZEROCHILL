name: Temporary Shows Motion Patch

on:
  push:
    branches:
      - feature/shows-youtube-motion
    paths:
      - tools/tmp_patch_shows_motion.py
      - .github/workflows/tmp-shows-motion-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/shows-youtube-motion
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply focused Shows motion patch
        run: python3 tools/tmp_patch_shows_motion.py

      - name: Compile and run focused test
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac :app:testDebugUnitTest --tests 'com.webapp.crazyshit.ShowsWatchLaunchTest' --no-daemon

      - name: Remove temporary patch plumbing
        run: |
          rm -f tools/tmp_patch_shows_motion.py
          rm -f .github/workflows/tmp-shows-motion-patch.yml

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: smooth Shows watch launch motion'
          git push origin HEAD:feature/shows-youtube-motion

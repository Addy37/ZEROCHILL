name: Read-only 7.0.5 artifact review
on:
  push:
    branches: [release/zerochill-7.0.5]
    paths: [.github/workflows/release-705-artifact-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Download exactly the completed candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Addy37/ZEROCHILL/actions/artifacts/14172520587/zip > artifact.zip
          python3 - <<'PY'
          import hashlib,zipfile,pathlib
          assert hashlib.sha256(pathlib.Path('artifact.zip').read_bytes()).hexdigest()=='a531e3b92740b7afd5ce08fb5203bb56bb05573aed0a94218fec03f598676124'
          with zipfile.ZipFile('artifact.zip') as archive:
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in archive.namelist())
              archive.extractall('review')
          PY
      - name: Verify bytes and inspect complete reports (no rebuild or backend calls)
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,zipfile,xml.etree.ElementTree as E,collections,base64,zlib,re
          root=pathlib.Path('review')
          apks=list(root.rglob('*.apk'))
          assert len(apks)==1
          apk=apks[0]
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest=='8e043cb79545fe40d5b6aa942c5a01af59edb631a43bff89af1d9ace0ab06a01'
          ident=json.loads(next(root.rglob('verification.json')).read_text())
          assert ident['sha256']==digest and ident['size_bytes']==apk.stat().st_size
          assert ident['source_sha']=='ea55674972c047efc2c42aaffc0e60e566c7203e'
          assert ident['application_id']=='com.addy37.crazyshitunofficial' and ident['version_code']==7000005 and ident['version_name']=='7.0.5'
          with zipfile.ZipFile(apk) as package:
              dex=b''
              for name in package.namelist():
                  data=package.read(name)
                  for marker in ('fketutffusxgjxjlckci','xswtgidwhesajavxjbjb','sb_secret_'):
                      assert marker.encode() not in data and marker.encode('utf-16le') not in data
                  if name.endswith('.dex'): dex+=data
              assert ident['source_sha'].encode() in dex
              assert b'https://aavjpykssueavbseqdlf.supabase.co' in dex
          print('DOWNLOADED_APK_IDENTITY',json.dumps(ident,sort_keys=True))
          sums=next(root.rglob('SHA256SUMS.txt')).read_text()
          assert digest in sums and apk.name in sums
          print('CHECKSUM_FILE',sums)
          results=json.loads(next(root.rglob('test-results.json')).read_text())
          print('FULL_TEST_RESULTS',json.dumps(results,sort_keys=True))
          for variant,data in results.items():
              assert data['tests']==1813 and data['failures']==data['errors']==0 and data['skipped']==4
          report=E.parse(next(root.rglob('lint-results-debug.xml'))).getroot()
          base=collections.Counter(json.loads(zlib.decompress(base64.b64decode('')).decode()))
          def key(i): return json.dumps([i.get('id'),i.get('severity'),i.get('message'),[x.get('file','').split('/app/',1)[-1] for x in i.findall('location')]],ensure_ascii=True)
          actual=collections.Counter(key(i) for i in report.findall('issue'))
          print('LINT_COUNTS',dict(collections.Counter(i.get('severity') for i in report.findall('issue'))))
          for k,count in (actual-base).items(): print('LINT_ADDED_VS_LOCAL_MAIN',count,k)
          for k,count in (base-actual).items(): print('LINT_REMOVED_VS_LOCAL_MAIN',count,k)
          print('UPGRADE_RESULT',next(root.rglob('result.json')).read_text())
          log=next(root.rglob('logcat.txt')).read_text()
          fatal=[l for l in log.splitlines() if re.search(r'FATAL EXCEPTION|Fatal signal|ANR in |OutOfMemoryError',l)]
          print('RUNTIME_FATAL_MARKERS',json.dumps(fatal))
          for name in ('memory-start.txt','memory-end.txt'):
              print('MEMORY',name,' | '.join(l.strip() for l in next(root.rglob(name)).read_text().splitlines() if 'TOTAL' in l or 'Views:' in l or 'Activities:' in l))
          PY
      - name: Independently verify APK signer and manifest
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/apksigner" || sdkmanager 'build-tools;35.0.0'
          APK="$(find review -name '*.apk' -print -quit)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -n 4

name: ShitTok cold process startup
on:
  pull_request:
    branches: [rebrand/zerochill]
    paths: ['app/**', 'tools/measure_shittok_cold_start.sh', '.github/workflows/shittok-startup.yml']
permissions:
  contents: read
concurrency:
  group: shittok-startup-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  measure:
    if: ${{ github.head_ref == 'feature/shittok-deep-source-exploration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ANALYTICS_ENDPOINT: ''
      SHITTOK_POOL_DIAGNOSTICS: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Tests and debug APK
        run: >-
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.ChaosStartupPreloaderTest'
          --tests 'com.webapp.crazyshit.ChaosStarterSourcesTest'
          --tests 'com.webapp.crazyshit.ChaosSourceMixerPriorityTest'
          --tests 'com.webapp.crazyshit.ShitTokSpeedMuteTest'
          --tests 'com.webapp.crazyshit.ShitTokAudioOwnershipTest'
          --tests 'com.webapp.crazyshit.ShitTokContinuityTest'
          --tests 'com.webapp.crazyshit.ShitTokOrientationAdmissionTest'
          --tests 'com.webapp.crazyshit.ShitTokBufferSourceHarvestTest'
          --tests 'com.webapp.crazyshit.ShitTokRunwayPolicyTest'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-boot-timeout: 180
          disable-animations: false
          script: bash tools/measure_shittok_cold_start.sh startup-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shittok-cold-start-${{ github.event.pull_request.head.sha }}
          path: |
            startup-evidence/
            app/build/test-results/testDebugUnitTest/

name: Pawchive exact thumbnail contract
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/pawchive-thumbnail-trace.yml']
permissions:
  contents: read
jobs:
  trace:
    if: github.head_ref == 'feature/pawchive-onlyfap'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check exact attachment metadata and preview read contract
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, re, struct, subprocess, tempfile, time
          import urllib.request as request
          import urllib.error
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          origin = 'https://pawchive.pw'
          agent = 'ZEROCHILL/7.5.0 (+https://github.com/Addy37/ZEROCHILL)'
          creator_key = '50ea710167d71247a784ff8a5a9297d56e9c3084dbfbd83feda0b0bbdae9bf0d'
          attachment_key = 'a0a09d50c23e9b24e43e3c1281cd6b20148762540708dac467210e7fa5b4b89a'
          def key(text):
              return hashlib.sha256(text.encode()).hexdigest()
          def api(path):
              req = request.Request(origin + '/api/v1' + path,
                                    headers={'User-Agent': agent, 'Accept': 'application/json'})
              with request.urlopen(req, timeout=8) as res:
                  return json.loads(res.read(32 * 1024 * 1024))
          catalog = api('/creators')
          choices = [row for row in catalog if key(row['name'].strip().lower()) == creator_key]
          print('Matching public profiles', len(choices), flush=True)
          target = None
          for creator in choices[:4]:
              profile = '/' + creator['service'] + '/user/' + creator['id']
              for offset in range(0, 1000, 50):
                  rows = api(profile+'?o='+str(offset))
                  for row in rows:
                      for asset in [row.get('file'), *(row.get('attachments') or [])]:
                          if asset and key(asset.get('path', '').rsplit('/',1)[-1]) == attachment_key:
                              target = (asset, profile, row['id'], offset)
                              break
                      if target: break
                  if target or len(rows) < 50: break
              if target: break
          if not target:
              raise SystemExit('Exact attachment absent from the bounded creator listing probe')
          asset, profile, post, offset = target
          path = asset['path']
          if path.startswith('/data/'): path = path[len('/data'):]
          server = asset['server'].rstrip('/')
          assert re.fullmatch(r'https://n[1-9][0-9]{0,2}[.]pawchive[.]pw', server)
          print('Exact clip found at post offset', offset, 'attachment fields', sorted(asset), flush=True)
          url = server + '/data' + path
          class VideoMarkup(HTMLParser):
              poster = False
              source = False
              def handle_starttag(self, tag, pairs):
                  attrs=dict(pairs)
                  if tag == 'video' and attrs.get('poster'): self.poster = True
                  if tag == 'source' and key(urlsplit(attrs.get('src','')).path.rsplit('/',1)[-1]) == attachment_key:
                      self.source = True
          with request.urlopen(request.Request(origin + profile + '/post/' + post,
                                  headers={'User-Agent':agent}), timeout=8) as res:
              page = VideoMarkup()
              page.feed(res.read(4 * 1024 * 1024).decode(errors='replace'))
              print('Public inline source for clip', page.source, 'video poster present', page.poster, flush=True)
          last = 0
          def bytes_at(start, count):
              global last
              time.sleep(max(0, last + 1.15 - time.monotonic()))
              last=time.monotonic()
              req = request.Request(url, headers={'User-Agent':agent, 'Referer':origin+'/',
                    'Accept-Encoding':'identity','Range':f'bytes={start}-{start+count-1}'})
              with request.urlopen(req, timeout=10) as res:
                  match = re.fullmatch(r'bytes (\d+)-(\d+)/(\d+)', res.headers.get('Content-Range', ''))
                  print('Requested', start, count, 'received', res.status, res.headers.get('Content-Type'),
                        res.headers.get('Content-Range'), flush=True)
                  assert res.status==206 and match
                  first, end, total = map(int, match.groups())
                  body = res.read(count+1)
                  assert (first, end, len(body)) == (start, min(total-1,start+count-1), end-start+1)
                  return body, total
          with tempfile.TemporaryDirectory() as scratch:
              head, total = bytes_at(0, 1024*1024)
              at=0
              packets=[]
              while at < total and len(packets) < 12:
                  chunk=head[at:at+16] if at+16<=len(head) else bytes_at(at,16)[0]
                  if len(chunk)<8: break
                  size, kind=struct.unpack('>I4s',chunk[:8])
                  size=struct.unpack('>Q',chunk[8:16])[0] if size==1 else size or total-at
                  if size<8 or at+size>total: break
                  print('MP4 box', kind.decode(errors='replace'), at, size, flush=True)
                  packets.append((kind, at, size))
                  at+=size
              if not any(kind==b'moov' for kind,_,_ in packets):
                  raise SystemExit('No MP4 index visible')
              file=os.path.join(scratch,'sample.mp4')
              with open(file,'wb') as out:
                  out.truncate(total)
                  data, _ = bytes_at(0,min(total,4*1024*1024))
                  out.write(data)
                  for kind,at,size in packets:
                      if kind!=b'moov' or at+size<=len(data): continue
                      assert size<=4*1024*1024
                      out.seek(at)
                      out.write(bytes_at(at,size)[0])
              process=subprocess.run(['ffmpeg','-v','error','-i',file,'-frames:v','1','-f','null','-'],
                                     capture_output=True, timeout=15)
              print('First frame decoded from bounded head and MP4 index', process.returncode==0
                    and not process.stderr, flush=True)
          PYTHON

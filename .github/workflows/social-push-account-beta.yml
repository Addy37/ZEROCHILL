name: Build Configured Social Push Beta

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0
    paths:
      - .github/workflows/social-push-account-beta.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZEROCHILL_SOURCE_SHA: 34278ca4b0a09499aae7681794d3faaf3f4f5442
      FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
      FEEDBACK_ANON_KEY: ${{ secrets.FEEDBACK_ANON_KEY }}
      SOURCE_CONFIG_ENDPOINT: https://fketutffusxgjxjlckci.supabase.co/functions/v1/app-config
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FEEDBACK_ANON_KEY }}
      ANALYTICS_ENDPOINT: ""
      SHITTOK_POOL_DIAGNOSTICS: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 34278ca4b0a09499aae7681794d3faaf3f4f5442
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android APIs 35 and 36
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Verify fixed source and account configuration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "34278ca4b0a09499aae7681794d3faaf3f4f5442"
          test -n "$FEEDBACK_ENDPOINT"
          test -n "$FEEDBACK_ANON_KEY"
          grep -F 'CHANNEL_SOCIAL = "social_v1"' app/src/main/java/com/webapp/crazyshit/ZeroChillPushNotificationPresenter.java
          grep -F 'comment_reply_push_webhook' supabase/migrations/202610250006_social_push_webhooks.sql
          grep -F 'comment_like_push_webhook' supabase/migrations/202610250006_social_push_webhooks.sql

      - name: Run focused social push regressions
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.ZeroChillPushNotificationPresenterTest'
          --tests 'com.webapp.crazyshit.ZeroChillSocialPushRoutingTest'
          --tests 'com.webapp.crazyshit.UpdateInboxStoreTest'
          --tests 'com.webapp.crazyshit.NotificationCenterUiTest'

      - name: Build configured debug beta
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename beta
        run: cp app/build/outputs/apk/debug/app-debug.apk ZeroChill-34278ca-Social-Push-Configured-Beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-Social-Push-Configured-Beta
          path: ZeroChill-34278ca-Social-Push-Configured-Beta.apk
          if-no-files-found: error
          retention-days: 7

name: ZEROCHILL Phase 4 Shared Chrome Preview

# One signed candidate and focused tests for the new shared-chrome branch.
# Keep Phase 4 separate from the device-approved Compose Preview 6 branch.
on:
  push:
    branches:
      - feature/zerochill-7-shared-chrome-phase4
    paths:
      - .github/workflows/phase4-shared-chrome-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase4-preview:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: "6000009"
      APP_VERSION_NAME: "7.0.0-compose-preview.7"
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
      ANALYTICS_ENDPOINT: ""
      ANALYTICS_V2_ENDPOINT: ""

    steps:
      - name: Check out exact source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 and 36
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Restore existing production signing identity
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              sys.exit("Missing repository signing bundle")
          data = json.loads(raw.replace("\r", "").replace("\n", ""))
          required = ("keystore_base64", "store_password", "key_alias", "key_password")
          if any(not data.get(key) for key in required):
              sys.exit("Signing bundle incomplete")
          for key in ("store_password", "key_alias", "key_password"):
              print("::add-mask::" + data[key])
          keystore = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zerochill-appearance-preview.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_base64"]))
          keystore.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"ANDROID_KEYSTORE_PATH={keystore}\n")
              out.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              out.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              out.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

      - name: Focused appearance tests and one signed release build
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.AppearanceThemeTest'
          --tests 'com.webapp.crazyshit.HeaderGlassMaterialTest'
          --tests 'com.webapp.crazyshit.SettingsComposeScreenModelTest'
          --tests 'com.webapp.crazyshit.ZeroChillComposeMenuTest'
          --tests 'com.webapp.crazyshit.ZeroChillFoundationTest'
          --tests 'com.webapp.crazyshit.BottomNavigationDrawableRenderTest'
          --tests 'com.webapp.crazyshit.ContentPreferenceTest'
          --tests 'com.webapp.crazyshit.ZeroChillControlsTest.menuDispatchesItemCallbackAndControlStylesKeepNativeState'
          :app:assembleRelease

      - name: Verify production upgrade identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.addy37.crazyshitunofficial'"
          echo "$BADGING" | grep -q "versionCode='6000009'"
          mkdir -p "$RUNNER_TEMP/stable"
          gh release download v6.0.2 --repo "$GITHUB_REPOSITORY" \
            --pattern ZeroChill.apk --dir "$RUNNER_TEMP/stable"
          CANDIDATE_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          STABLE_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/stable/ZeroChill.apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          test -n "$CANDIDATE_CERT"
          test "$CANDIDATE_CERT" = "$STABLE_CERT"
          STABLE_BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$RUNNER_TEMP/stable/ZeroChill.apk")"
          STABLE_CODE="$(echo "$STABLE_BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          test 6000009 -gt "$STABLE_CODE"
          OUT="ZeroChill-OG-Phase4-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:7}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > SHA256SUMS-phase4.txt

      - name: Upload signed upgrade APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-phase4-shared-chrome-upgrade
          path: |
            ZeroChill-OG-Phase4-*.apk
            SHA256SUMS-phase4.txt
          retention-days: 14
          if-no-files-found: error

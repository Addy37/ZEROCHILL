name: Repair Native Age Prompt Patch Runner

on:
  push:
    branches: [ feature/zerochill-notifications-5.3.0 ]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/zerochill-notifications-5.3.0
          fetch-depth: 0
      - name: Use repository Gradle command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/xmegadrive-native-age-prompt-patch.yml')
          text = path.read_text()
          old = './gradlew --no-daemon :app:testDebugUnitTest'
          new = 'gradle --no-daemon :app:testDebugUnitTest'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Gradle command, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove repair workflow
        run: git rm .github/workflows/fix-native-age-patch-runner.yml
      - name: Commit runner repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/xmegadrive-native-age-prompt-patch.yml
          git commit -m "Use repository Gradle command for XMegaDrive prompt tests"
          git push origin HEAD:feature/zerochill-notifications-5.3.0

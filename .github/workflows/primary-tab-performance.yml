name: Primary Tab Activation Comparison

on:
  pull_request:
    branches: [ rebrand/zerochill ]
    paths: [ 'app/**', '.github/workflows/primary-tab-performance.yml' ]

permissions:
  contents: read

jobs:
  tab-comparison:
    if: ${{ github.head_ref == 'feature/primary-tab-activation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANALYTICS_ENDPOINT: ""
      BASE_SHA: 3f1b919e8c915c83b21017c456a5287274730bf1
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic
      - name: Build both instrumented APK pairs before booting the emulator
        run: bash tools/run_primary_tab_comparison.sh build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare approved and candidate primary navigation on the same emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          disk-size: 4096M
          ram-size: 2048M
          script: bash tools/run_primary_tab_comparison.sh measure
      - name: Print frame and navigation measurements
        if: always()
        run: |
          find "$RUNNER_TEMP/primary-tab-comparison" -type f -name '*benchmarkData.json' -print -exec cat {} \; 2>/dev/null || true
      - name: Preserve paired frames, traces and device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-primary-tab-comparison
          path: ${{ runner.temp }}/primary-tab-comparison/
          if-no-files-found: warn
          retention-days: 7

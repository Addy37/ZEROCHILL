name: Android Performance Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "baselineprofile/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/performance.yml"
      - "tools/run_performance_audit.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}${{ github.head_ref == 'fix/xmegadrive-shows-lifecycle' && '-creator-lifecycle' || '' }}
  cancel-in-progress: ${{ github.head_ref == 'hotfix/5.6.1-filtered-shittok' || github.head_ref == 'feature/smart-shittok-v2' || github.head_ref == 'fix/baddiehub-canonical-creator' || github.head_ref == 'feature/onlyfap-gallery-favorites' || github.head_ref == 'feature/shows-detail-cinematic-pagination' || github.head_ref == 'feature/shows-youtube-motion' || github.head_ref == 'feature/shows-watch-page' || github.head_ref == 'feature/zerochill-notifications-5.3.0' || github.head_ref == 'fix/xmegadrive-shows-lifecycle' || (github.head_ref == 'feature/search-recent-glass' || github.head_ref == 'feature/search-liquid-material') || github.head_ref == 'feature/shows-episode-list' || github.head_ref == 'fix/library-startup-navigation' || github.head_ref == 'feature/onlyfap-liquid-rift' || github.head_ref == 'feature/zerochill-5.1.0' }}

permissions:
  contents: read

jobs:
  cancel-superseded-matrix:
    # This focused follow-up must not launch the general ten-flow benchmark.
    if: ${{ (github.head_ref == 'feature/search-recent-glass' || github.head_ref == 'feature/search-liquid-material') || github.head_ref == 'feature/shows-episode-list' || github.head_ref == 'fix/shittok-async-creator-metadata' || github.head_ref == 'fix/shittok-startup-handoff' || github.head_ref == 'fix/onlyfap-first-open' || github.head_ref == 'fix/library-onlyfap-creator-context' || github.head_ref == 'feature/onlyfap-liquid-rift' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older general-matrix runs for this candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_BRANCH: ${{ github.head_ref }}
          CURRENT_RUN: ${{ github.run_id }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$CANDIDATE_BRANCH" = "fix/library-onlyfap-creator-context" ]; then
            # Same branch, older heads only. Preserve the current candidate's build/signing jobs.
            gh api --method GET "repos/$GH_REPO/actions/runs" -f branch="$CANDIDATE_BRANCH" -f per_page=100 \
              --jq ".workflow_runs[] | select(.id < $CURRENT_RUN and .head_sha != \"$CANDIDATE_SHA\" and (.status == \"queued\" or .status == \"in_progress\")) | .id" |
            while read -r run_id; do
              if gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel"; then
                echo "Canceled superseded run $run_id"
              else
                echo "Could not cancel superseded run $run_id"
              fi
            done
            exit 0
          fi
          gh api --method GET "repos/$GH_REPO/actions/workflows/performance.yml/runs" -f branch="$CANDIDATE_BRANCH" --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id' |
          while read -r run_id; do
            if [ "$run_id" != "$CURRENT_RUN" ]; then
              gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel"
            fi
          done
  macrobenchmark:
    # This candidate uses the paired short-scroll audit instead of ten full flows.
    if: ${{ github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'release/zerochill-5.0.0' && github.head_ref != 'feature/shittok-dynamic-pinch' && github.head_ref != 'feature/primary-tab-activation' && github.head_ref != 'fix/notification-entry-latency' && github.head_ref != 'feature/spotlight-glass-search' && github.head_ref != 'feature/shittok-speed-mute' && github.head_ref != 'feature/shittok-deep-source-exploration' && github.head_ref != 'fix/shittok-async-creator-metadata' && github.head_ref != 'fix/shittok-startup-handoff' && github.head_ref != 'fix/onlyfap-first-open' && github.head_ref != 'feature/phone-content-grid-layout' && github.head_ref != 'feature/library-profile-redesign' && github.head_ref != 'fix/library-onlyfap-creator-context' && github.head_ref != 'fix/baddiehub-view-count-titles' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'feature/onlyfap-liquid-rift' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/search-recent-glass' && github.head_ref != 'feature/search-liquid-material' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' }}
    name: performance (${{ matrix.flow }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Macrobenchmark emulators must never write to production analytics.
      ANALYTICS_ENDPOINT: ""
    strategy:
      fail-fast: false
      matrix:
        # This lifecycle fix validates the affected creator flow without the unrelated ten-minute soak.
        include: >-
          ${{ fromJSON(github.head_ref == 'fix/baddiehub-canonical-creator'
          && '[{"flow":"chaos-scroll","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#chaosScroll","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},{"flow":"creator-gallery-playback","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#creatorGalleryAndPlayback","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"}]'
          || (github.head_ref == 'feature/smart-shittok-v2' || github.head_ref == 'hotfix/5.6.1-filtered-shittok')
          && '[{"flow":"chaos-scroll","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#chaosScroll","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},{"flow":"chaos-long-session","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#chaosLongSession","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"}]'
          || github.head_ref == 'feature/shittok-smart-ranking-v1'
          && '[{"flow":"chaos-scroll","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#chaosScroll","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"}]'
          || (github.head_ref == 'fix/xmegadrive-shows-lifecycle' || github.head_ref == 'feature/onlyfap-gallery-favorites')
          && '[{"flow":"creator-gallery-playback","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#creatorGalleryAndPlayback","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"}]'
          || '[
          {"flow":"startup","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#coldStartupUncompiled","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"shows-scroll","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#showsScroll","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"warm-startup","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#warmStartup","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"tab-switching","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#retainedTabSwitching","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"chaos-long-session","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#chaosLongSession","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"shows-scroll-motion","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#showsScroll","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"shows-watch-motion","test":"com.webapp.crazyshit.baselineprofile.ShowsWatchMotionBenchmark#openAndReturn","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"chaos-scroll","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#chaosScroll","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"search","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#searchFlow","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"creator-gallery-playback","test":"com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#creatorGalleryAndPlayback","rules":"Macrobenchmark","task":":baselineprofile:connectedBenchmarkReleaseAndroidTest"},
          {"flow":"baseline-profile","test":"com.webapp.crazyshit.baselineprofile.BaselineProfileGenerator","rules":"BaselineProfile","task":":baselineprofile:connectedNonMinifiedReleaseAndroidTest"}
          ]') }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Macrobenchmarks
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          # Pin the Shows host to stable 36.6.11 after repeated 37.2.12 exits.
          # Only the emulator binary changes: same API 35 image, GPU defaults,
          # real source work, animations and benchmark assertions.
          # Build/version: https://developer.android.com/studio/emulator_archive
          emulator-build: ${{ startsWith(matrix.flow, 'shows-') && '15507667' || '' }}
          disable-animations: ${{ matrix.flow != 'shows-scroll-motion' && matrix.flow != 'shows-watch-motion' }}
          disk-size: 4096M
          # The ten-minute trace processor exhausted the default emulator RAM.
          ram-size: ${{ matrix.flow == 'chaos-long-session' && '4096M' || '2048M' }}
          script: >-
            bash tools/run_performance_audit.sh ${{ matrix.task }}
            "-Pandroid.testInstrumentationRunnerArguments.class=${{ matrix.test }}"
            "-Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=${{ matrix.rules }}"

      - name: Print benchmark measurements
        if: always()
        run: |
          find baselineprofile/build/outputs -type f \
            \( -name '*.json' -o -name '*baseline-prof.txt' -o -name '*startup-prof.txt' \) \
            -print -exec sh -c 'echo PERFORMANCE_FILE_BEGIN:$1; cat "$1"; echo PERFORMANCE_FILE_END:$1' _ {} \; \
            2>/dev/null || true

      - name: Print device and harness diagnostics
        if: always()
        run: |
          find baselineprofile/build/outputs -type f -name '*.txt' \
            -exec sh -c 'echo "DIAGNOSTIC_FILE:$1"; tail -n 500 "$1"' _ {} \; \
            2>/dev/null || true

      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-performance-${{ matrix.flow }}
          path: |
            baselineprofile/build/outputs/connected_android_test_additional_output/
            baselineprofile/build/outputs/final-pass-diagnostics/
            baselineprofile/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

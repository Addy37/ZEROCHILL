name: Android Performance Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "baselineprofile/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

jobs:
  macrobenchmark:
    name: performance (${{ matrix.flow }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Macrobenchmark emulators must never write to production analytics.
      ANALYTICS_ENDPOINT: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - flow: startup
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#coldStartupUncompiled
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: shows-scroll
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#showsScroll
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: warm-startup
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#warmStartup
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: tab-switching
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#retainedTabSwitching
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: chaos-long-session
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#chaosLongSession
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: shows-scroll-motion
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#showsScroll
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: chaos-scroll
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#chaosScroll
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: search
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#searchFlow
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: creator-gallery-playback
            test: com.webapp.crazyshit.baselineprofile.MainFlowsBenchmark#creatorGalleryAndPlayback
            rules: Macrobenchmark
            task: :baselineprofile:connectedBenchmarkReleaseAndroidTest
          - flow: baseline-profile
            test: com.webapp.crazyshit.baselineprofile.BaselineProfileGenerator
            rules: BaselineProfile
            task: :baselineprofile:connectedNonMinifiedReleaseAndroidTest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Macrobenchmarks
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: ${{ matrix.flow != 'shows-scroll-motion' }}
          disk-size: 4096M
          script: >-
            bash tools/run_performance_audit.sh ${{ matrix.task }}
            "-Pandroid.testInstrumentationRunnerArguments.class=${{ matrix.test }}"
            "-Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=${{ matrix.rules }}"

      - name: Print benchmark measurements
        if: always()
        run: |
          find baselineprofile/build/outputs -type f \
            \( -name '*.json' -o -name '*baseline-prof.txt' -o -name '*startup-prof.txt' \) \
            -print -exec sh -c 'echo PERFORMANCE_FILE_BEGIN:$1; cat "$1"; echo PERFORMANCE_FILE_END:$1' _ {} \; \
            2>/dev/null || true

      - name: Print device and harness diagnostics
        if: always()
        run: |
          find baselineprofile/build/outputs -type f -name '*.txt' \
            -exec sh -c 'echo "DIAGNOSTIC_FILE:$1"; tail -n 500 "$1"' _ {} \; \
            2>/dev/null || true

      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-performance-${{ matrix.flow }}
          path: |
            baselineprofile/build/outputs/connected_android_test_additional_output/
            baselineprofile/build/outputs/final-pass-diagnostics/
            baselineprofile/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

name: Inspect BaddieHub title markup
on:
  push:
    branches: [fix/baddiehub-view-count-titles]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 - <<'PY'
          import json, urllib.request, re
          config=json.load(open('app/src/main/assets/source_config_defaults.json'))['sources']['baddiehub']
          headers=dict(config['requestHeaders'], **{'User-Agent':config['userAgent']})
          url=config['baseUrl']+'toni-camille/'
          html=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30).read().decode()
          cards=[m.group() for m in re.finditer(r'<a\b[^>]*href=[^>]+>.*?</a>',html,re.S) if '<img' in m.group()]
          for card in cards[:4]: print(card[:5000])
          for match in re.finditer(r'<h1\b.*?</h1>',html,re.S): print(match.group())
          PY

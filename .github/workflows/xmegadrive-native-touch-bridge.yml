name: Apply XMegaDrive Native Touch Bridge

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/zerochill-notifications-5.3.0
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Patch source and test
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Run focused XMegaDrive tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest --tests com.webapp.crazyshit.XMegaDriveAgePromptTest

      - name: Commit native touch bridge
        run: |
          if git diff --quiet -- app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java app/src/test/java/com/webapp/crazyshit/XMegaDriveAgeGateSafetyTest.java; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java app/src/test/java/com/webapp/crazyshit/XMegaDriveAgeGateSafetyTest.java
          git commit -m "Use native touch for XMegaDrive age confirmation"
          git push origin HEAD:feature/zerochill-notifications-5.3.0

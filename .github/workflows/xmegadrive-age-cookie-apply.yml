name: Apply XMegaDrive Age Cookie Fix

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/zerochill-notifications-5.3.0
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Apply age-cookie implementation
        run: python tools/xmegadrive_age_cookie_patch.py

      - name: Verify clean age path
        run: |
          grep -q 'kt_agecheck' app/src/main/java/com/webapp/crazyshit/XMegaDriveAgeSession.java
          grep -q 'CONFIRM 18+ & SET UP ACCESS' app/src/main/java/com/webapp/crazyshit/StartupWizardActivity.java
          grep -q 'XMegaDriveAccessSetupActivity' app/src/main/java/com/webapp/crazyshit/SplashActivity.java
          ! grep -q 'ageGateNativeTapTargetScript' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'dispatchNativeTap' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'MotionEvent.obtain' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'el.click()' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'revealRawAgeFallback' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          test ! -e app/src/main/java/com/webapp/crazyshit/XMegaDriveAgeDiagnostics.java

      - name: Run focused regressions
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest
          --tests com.webapp.crazyshit.XMegaDriveAgePromptTest
          --tests com.webapp.crazyshit.XMegaDriveAgeSessionTest
          --tests com.webapp.crazyshit.StartupWizardUiTest
          --tests com.webapp.crazyshit.StartupWizardPolicyTest
          --tests com.webapp.crazyshit.ChaosStartupPreloaderTest

      - name: Build debug beta
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app baselineprofile
          git diff --cached --quiet && exit 0
          git commit -m 'Use explicit XMegaDrive age cookie setup'
          git push origin HEAD:feature/zerochill-notifications-5.3.0

name: ZEROCHILL 7.0.5 Side-by-Side Beta

# One-time device-acceptance build. Upload an Actions artifact only.
# Never create a GitHub Release or update the public stable channel.
on:
  push:
    branches:
      - build/zerochill-7.0.5-side-by-side-beta

permissions:
  contents: read

jobs:
  signed-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      APP_VERSION_CODE: '7000005'
      APP_VERSION_NAME: '7.0.5-beta.1'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact beta source
        uses: actions/checkout@v6

      - name: Set up Java 17 and 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platforms and build tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Restore stable signing certificate for separate beta package
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get('SIGNING_BUNDLE', '')
          if not raw:
              raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data = json.loads(raw.replace('\r', '').replace('\n', ''))
          for field in ('keystore_base64', 'store_password', 'key_alias', 'key_password'):
              if not data.get(field):
                  raise SystemExit('Missing signing item: ' + field)
          for field in ('store_password', 'key_alias', 'key_password'):
              print('::add-mask::' + data[field])
          key_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zerochill-705-beta.jks'
          key_path.write_bytes(base64.b64decode(data['keystore_base64']))
          key_path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              for name, value in {
                  'ANDROID_KEYSTORE_PATH': str(key_path),
                  'ANDROID_KEYSTORE_PASSWORD': data['store_password'],
                  'ANDROID_KEY_ALIAS': data['key_alias'],
                  'ANDROID_KEY_PASSWORD': data['key_password']
              }.items():
                  target.write(name + '=' + value + '\n')
          PY

      - name: Run focused beta tests and build signed debug APK
        run: |
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 \
            :app:testDebugUnitTest \
            --tests '*AnchoredMenuLifecycleTest' \
            --tests '*BunkrIndexSearchTest' \
            --tests '*OnlyHavenHtmlFallbackTest' \
            --tests '*SupportZeroChillDialogTest' \
            --tests '*WhatsNewTest' \
            :app:assembleDebug

      - name: Validate side-by-side package, version, backend, and signing
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/aapt2" dump badging "$APK" | tee /tmp/zerochill-beta-badging.txt
          grep -F "package: name='com.addy37.crazyshitunofficial.dev' versionCode='7000005'" /tmp/zerochill-beta-badging.txt
          grep -F "application-label:'ZeroChill Beta'" /tmp/zerochill-beta-badging.txt
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/zerochill-beta-signing.txt
          grep -Fi '04abf84b3d468cbb1a562dea83b0007e686b2e56018cce911223963faea51356' /tmp/zerochill-beta-signing.txt
          python3 - "$APK" "$GITHUB_SHA" <<'PY'
          import pathlib, sys, zipfile
          apk, source_sha = sys.argv[1:]
          config = pathlib.Path('app/build/generated/source/buildConfig/debug/com/webapp/crazyshit/BuildConfig.java').read_text()
          checks = [
              'ZEROCHILL_V7_TRAFFIC = true;',
              'https://aavjpykssueavbseqdlf.supabase.co',
              'ANALYTICS_ENDPOINT = "";',
              'ANALYTICS_V2_ENDPOINT = "";',
              source_sha,
          ]
          for marker in checks:
              assert marker in config, 'Missing beta build setting: ' + marker
          with zipfile.ZipFile(apk) as package:
              dex = b''.join(package.read(name) for name in package.namelist() if name.endswith('.dex'))
              assert b'aavjpykssueavbseqdlf' in dex, 'New Zerochill backend missing'
              assert b'fketutffusxgjxjlckci' not in dex, 'Retired backend detected'
          print('Verified separate signed 7.0.5 beta; stable app identity is untouched')
          PY

      - name: Upload beta APK and checksum only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          APK_NAME="ZeroChill-7.0.5-Beta-build-zerochill-7.0.5-side-by-side-beta-${GITHUB_SHA:0:7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "candidate/$APK_NAME"
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)

      - name: Store private build artifact, not a release
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-7.0.5-Side-by-Side-Beta
          path: candidate/
          if-no-files-found: error
          retention-days: 14

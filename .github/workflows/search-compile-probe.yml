name: Search Compile Probe

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'perf/search-response-pass'
    runs-on: ubuntu-latest
    env:
      ZEROCHILL_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      SHITTOK_POOL_DIAGNOSTICS: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Capture exact Gradle failure
        id: gradle
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.webapp.crazyshit.ShitTokCreatorGalleryHandoffTest' \
            > search-compile.log 2>&1
          code=$?
          tail -n 300 search-compile.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload compiler log
        uses: actions/upload-artifact@v4
        with:
          name: search-compile-log
          path: search-compile.log
          retention-days: 1
      - name: Fail when Gradle failed
        if: steps.gradle.outputs.exit_code != '0'
        run: exit 1

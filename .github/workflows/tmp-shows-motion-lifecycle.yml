name: Temporary Shows Motion Lifecycle Fix

on:
  push:
    branches:
      - feature/shows-youtube-motion
    paths:
      - tools/tmp_patch_shows_motion_lifecycle.py
      - .github/workflows/tmp-shows-motion-lifecycle.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/shows-youtube-motion
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Apply lifecycle fix
        run: python3 tools/tmp_patch_shows_motion_lifecycle.py

      - name: Compile and run focused test
        run: >-
          gradle --no-daemon :app:compileDebugJavaWithJavac :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.ShowsWatchLaunchTest'

      - name: Remove temporary patch plumbing
        run: |
          rm -f tools/tmp_patch_shows_motion_lifecycle.py
          rm -f .github/workflows/tmp-shows-motion-lifecycle.yml

      - name: Commit lifecycle fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: defer Shows player creation while backgrounded'
          git push origin HEAD:feature/shows-youtube-motion

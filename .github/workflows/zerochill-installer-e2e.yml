name: ZEROCHILL Private Installer E2E APK Pair

# Build two production-signed versions as a single private Actions artifact.
# No draft, prerelease, public release, or automatic app channel change.
on:
  push:
    branches: [feature/zerochill-safe-installer-beta]
    paths:
      - .github/workflows/zerochill-installer-e2e.yml

permissions:
  contents: read

jobs:
  installer-e2e-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_VERSION_CODE: '7002002'
      APP_VERSION_NAME: '7.2.1-installer-beta.2'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gate approved lineage and test harness source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 20e4fd47dc7f23873ece2c3f1ff735b3f85b4bf0 HEAD
          git merge-base --is-ancestor 46f5d53abcd1c65dff8e603d0568d05211cce57b HEAD
          git merge-base --is-ancestor 020b73eeeaf6bb792e187bf09a9c26f83b607ce4 HEAD
          grep -q 'Test APK installer' app/src/main/java/com/webapp/crazyshit/SettingsActivity.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android APIs
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Restore production signing identity
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib
          raw=os.environ.get('SIGNING_BUNDLE','')
          if not raw: raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data=json.loads(raw.replace('\r','').replace('\n',''))
          for key in ('keystore_base64','store_password','key_alias','key_password'):
              if not data.get(key): raise SystemExit('Missing signing item '+key)
          for key in ('store_password','key_alias','key_password'):
              print('::add-mask::'+data[key])
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'installer-e2e-test.jks'
          path.write_bytes(base64.b64decode(data['keystore_base64']))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for k,v in {'ANDROID_KEYSTORE_PATH':str(path),
                          'ANDROID_KEYSTORE_PASSWORD':data['store_password'],
                          'ANDROID_KEY_ALIAS':data['key_alias'],
                          'ANDROID_KEY_PASSWORD':data['key_password']}.items():
                  out.write(k+'='+v+'\n')
          PY
      - name: Focused updater tests and signed harness APK
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:testReleaseUnitTest
          --tests '*AppUpdaterInstallerTest'
          --tests '*UpdateCardControllerTest'
          :app:assembleRelease
      - name: Preserve signed harness APK
        run: |
          set -euo pipefail
          mkdir -p candidate
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk \
            "candidate/ZeroChill-7.2.1-installer-beta.2-${SAFE_BRANCH}-${GITHUB_SHA:0:7}.apk"
      - name: Build the higher-version signed fixture APK
        env:
          APP_VERSION_CODE: '7002003'
          APP_VERSION_NAME: '7.2.1-installer-beta.3'
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:assembleRelease
      - name: Preserve signed fixture APK
        run: |
          set -euo pipefail
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk \
            "candidate/ZeroChill-7.2.1-installer-beta.3-${SAFE_BRANCH}-${GITHUB_SHA:0:7}.apk"
      - name: Verify both APKs, current production identity, and correct versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stable"
          gh release download v7.2.0 --repo "$GITHUB_REPOSITORY" --pattern ZeroChill.apk --dir "$RUNNER_TEMP/stable"
          python3 - <<'PY'
          import glob,os,pathlib,re,subprocess
          bt=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          def run(*args): return subprocess.check_output(args,text=True)
          def inspect(path):
              badging=run(str(bt/'aapt2'),'dump','badging',path)
              hit=re.search(r"package: name='([^']+)' versionCode='(\d+)'",badging)
              assert hit,'Missing version / application ID'
              certificates=run(str(bt/'apksigner'),'verify','--print-certs',path)
              signer=re.search(r'Signer #1 certificate SHA-256 digest: ([a-f0-9]+)',certificates)
              assert signer,'APK is not signed'
              return hit[1],int(hit[2]),signer[1]
          stable=inspect(str(pathlib.Path(os.environ['RUNNER_TEMP'])/'stable/ZeroChill.apk'))
          harness=glob.glob('candidate/*installer-beta.2-*.apk')
          fixture=glob.glob('candidate/*installer-beta.3-*.apk')
          assert len(harness)==len(fixture)==1, 'Exactly one APK of each version required'
          h,f=inspect(harness[0]),inspect(fixture[0])
          assert stable[0]==h[0]==f[0]=='com.addy37.crazyshitunofficial','Wrong application identity'
          assert (stable[1],h[1],f[1])==(7002000,7002002,7002003),'Wrong version or upgrade order'
          assert stable[2]==h[2]==f[2]=='04abf84b3d468cbb1a562dea83b0007e686b2e56018cce911223963faea51356','Changed signing identity'
          for p in harness+fixture:
              permissions=run(str(bt/'aapt2'),'dump','permissions',p)
              assert 'android.permission.REQUEST_INSTALL_PACKAGES' in permissions,'Installer permission missing'
          generated=pathlib.Path('app/build/generated/source/buildConfig/release/com/webapp/crazyshit/BuildConfig.java').read_text()
          assert 'ZEROCHILL_V7_TRAFFIC = true;' in generated
          assert 'https://aavjpykssueavbseqdlf.supabase.co' in generated
          assert 'ANALYTICS_ENDPOINT = "";' in generated and 'ANALYTICS_V2_ENDPOINT = "";' in generated
          assert os.environ['GITHUB_SHA'] in generated
          report=('Source: '+os.environ['GITHUB_SHA']+'\nBranch: '+os.environ['GITHUB_REF_NAME']+
              '\nApplication ID: '+h[0]+
              '\nVersions: '+str(h[1])+' -> '+str(f[1])+
              '\nSigning certificate SHA256: '+h[2]+
              '\nSigned, versioned test pair verified; production identity preserved.\n'+
              'No GitHub public release or rollout. Play Protect and installer still need phone verification.\n')
          pathlib.Path('candidate/VALIDATION.txt').write_text(report)
          print(report)
          PY
          cp docs/SAFE_INSTALLER_BETA.md candidate/TEST_INSTRUCTIONS.md
          cp -r app/build/test-results/testReleaseUnitTest candidate/updater-test-results
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ZEROCHILL-installer-end-to-end-pair-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14

name: Publish ZeroChill Signed APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
  # One-time 7.0.3 launch trigger. Removed after successful publication.
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION
permissions:
  contents: write

jobs:
  release:
    # Push dispatch is restricted to the expressly approved 7.0.3 release commit.
    # Restore manual-only dispatch after the release completes.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'RELEASE_ZEROCHILL_703')))
    runs-on: ubuntu-latest
    env:
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Resolve release version and branding
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi
          test -n "$VERSION" || { echo "Release version is empty"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$VERSION" = "7.0.3" || { echo "One-time push trigger only permits 7.0.3"; exit 1; }
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          python3 - "$VERSION" <<'PY'
          import os, re, sys
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          if not match:
              raise SystemExit("Stable version must be major.minor.patch")
          major, minor, patch = map(int, match.groups())
          if major != 7 or (minor, patch) < (0, 2):
              raise SystemExit("Only ZEROCHILL 7.0.2+ releases are allowed")
          if minor >= 1000 or patch >= 1000:
              raise SystemExit("Minor and patch versions must be below 1000")
          code = major * 1_000_000 + minor * 1000 + patch
          if not 0 < code <= 2_100_000_000:
              raise SystemExit("Version code is outside Android limits")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"APP_VERSION_CODE={code}\n")
          PY
          echo "APK_PRIMARY=ZeroChill.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=ZeroChill v${VERSION}" >> "$GITHUB_ENV"

      - name: Set up Java toolchains for Android 7 tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android APIs 35 and 36
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Restore private release signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, sys
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              sys.exit("Missing repository secret: ANDROID_SIGNING_BUNDLE")
          raw = raw.replace("\r", "").replace("\n", "")
          data = json.loads(raw)
          required = ["keystore_base64", "store_password", "key_alias", "key_password"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              sys.exit("Signing bundle is missing: " + ", ".join(missing))
          for key in ("store_password", "key_alias", "key_password"):
              print(f"::add-mask::{data[key]}")
          keystore = pathlib.Path(os.environ["RUNNER_TEMP"]) / "crazyshit-release.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_base64"]))
          keystore.chmod(0o600)
          env_file = pathlib.Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as f:
              f.write(f"ANDROID_KEYSTORE_PATH={keystore}\n")
              f.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              f.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              f.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

      - name: Build signed release APK
        run: gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 :app:testReleaseUnitTest :app:assembleRelease

      - name: Prepare and verify release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_PRIMARY"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PRIMARY"
          sha256sum "$APK_PRIMARY" > SHA256SUMS.txt

      - name: Fail closed unless APK uses New Zerochill 7
        run: |
          python3 - <<'PY'
          import os, pathlib, zipfile
          release = pathlib.Path('ZeroChill.apk')
          generated = pathlib.Path('app/build/generated/source/buildConfig/release/com/webapp/crazyshit/BuildConfig.java')
          assert release.is_file() and generated.is_file(), 'Missing release APK or config'
          config = generated.read_text()
          assert 'ZEROCHILL_V7_TRAFFIC = true;' in config, '7.0 traffic mode must be active'
          assert 'https://aavjpykssueavbseqdlf.supabase.co' in config, 'New backend must be used'
          assert 'ANALYTICS_ENDPOINT = "";' in config, 'Legacy analytics must be disabled'
          assert 'ANALYTICS_V2_ENDPOINT = "";' in config, 'Legacy analytics v2 must be disabled'
          assert os.environ['GITHUB_SHA'] in config, 'Incorrect source commit'
          with zipfile.ZipFile(release) as package:
              dex = b''.join(package.read(name) for name in package.namelist()
                             if name.endswith('.dex'))
              assert b'aavjpykssueavbseqdlf' in dex, 'New Supabase project not found'
              for name in package.namelist():
                  data = package.read(name)
                  assert b'fketutffusxgjxjlckci' not in data, 'Old backend marker: ' + name
                  assert 'fketutffusxgjxjlckci'.encode('utf-16le') not in data
          print('Release is New Zerochill only and contains the reviewed main source')
          PY

      - name: Verify upgrade from previous stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous-stable"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'ZeroChill.apk' --dir "$RUNNER_TEMP/previous-stable" \
            || gh release download --repo "$GITHUB_REPOSITORY" --pattern 'ZeroFilter.apk' --dir "$RUNNER_TEMP/previous-stable" \
            || gh release download --repo "$GITHUB_REPOSITORY" --pattern 'CrazyShit.apk' --dir "$RUNNER_TEMP/previous-stable"
          PREVIOUS="$(find "$RUNNER_TEMP/previous-stable" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$PREVIOUS"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CURRENT_INFO="$("$AAPT" dump badging "$APK_PRIMARY")"
          PREVIOUS_INFO="$("$AAPT" dump badging "$PREVIOUS")"
          printf '%s\n' "$CURRENT_INFO" | grep "package: name='com.addy37.crazyshitunofficial'"
          printf '%s\n' "$PREVIOUS_INFO" | grep "package: name='com.addy37.crazyshitunofficial'"
          CURRENT_CODE="$(printf '%s\n' "$CURRENT_INFO" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          PREVIOUS_CODE="$(printf '%s\n' "$PREVIOUS_INFO" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          test -n "$CURRENT_CODE" && test -n "$PREVIOUS_CODE"
          test "$CURRENT_CODE" -gt "$PREVIOUS_CODE"
          CURRENT_CERT="$("$SIGNER" verify --print-certs "$APK_PRIMARY" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          PREVIOUS_CERT="$("$SIGNER" verify --print-certs "$PREVIOUS" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          test -n "$CURRENT_CERT" && test "$CURRENT_CERT" = "$PREVIOUS_CERT"
          echo "Same package and certificate; versionCode $CURRENT_CODE > $PREVIOUS_CODE."

      - name: Upload signed APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-signed
          path: |
            ZeroChill.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            "$APK_PRIMARY" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md \
            --latest

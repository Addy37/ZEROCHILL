name: Apply XMegaDrive Age Diagnostic

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/zerochill-notifications-5.3.0
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Apply diagnostic patch
        run: python3 tools/xmegadrive_age_diagnostic_patch.py

      - name: Verify privacy guardrails
        run: |
          grep -q 'XMegaDriveAgeDiagnostics.captureBefore' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          grep -q 'XMegaDriveAgeDiagnostics.captureAfterAndShow' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          grep -q 'Values were not included' app/src/main/java/com/webapp/crazyshit/XMegaDriveAgeDiagnostics.java
          grep -q 'out\[k\]=fp(store.getItem(k))' app/src/main/java/com/webapp/crazyshit/XMegaDriveAgeDiagnostics.java
          ! grep -q 'clipboard.*cookie' app/src/main/java/com/webapp/crazyshit/XMegaDriveAgeDiagnostics.java

      - name: Run focused XMegaDrive tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.XMegaDriveAgeDiagnosticsTest --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest --tests com.webapp.crazyshit.XMegaDriveAgePromptTest

      - name: Build debug beta
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit diagnostic source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java \
                  app/src/main/java/com/webapp/crazyshit/XMegaDriveAgeDiagnostics.java \
                  app/src/test/java/com/webapp/crazyshit/XMegaDriveAgeDiagnosticsTest.java
          git diff --cached --quiet && exit 0
          git commit -m 'Add value-free XMegaDrive age diagnostics'
          git push origin HEAD:feature/zerochill-notifications-5.3.0

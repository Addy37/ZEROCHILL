name: Patch XMegaDrive Native Age Label Matcher

on:
  push:
    branches: [ feature/zerochill-notifications-5.3.0 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/zerochill-notifications-5.3.0
          fetch-depth: 0
      - name: Correct native age accept label regex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java')
          text = path.read_text()
          old = "+ \"||s==='yes'||/\\\\bi(?:']| am|m) 18\\\\b/.test(s));\""
          new = "+ \"||s==='yes'||/\\\\bi(?:'m| am|m) 18\\\\b/.test(s));\""
          if text.count(old) != 1:
              raise SystemExit(f'expected one malformed label matcher, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused XMegaDrive tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest --tests com.webapp.crazyshit.XMegaDriveAgePromptTest
      - name: Commit matcher fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          git commit -m "Fix XMegaDrive native age label matcher"
          git push origin HEAD:feature/zerochill-notifications-5.3.0

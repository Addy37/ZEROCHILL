name: Publish 3.0 Phase 1 APK

on:
  workflow_dispatch:
  push:
    branches: [ perf/3.0-phase-1, "release/**" ]
    paths:
      - ".github/workflows/publish-phase1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_NAME: 3.0.0-phase1.1-beta.1
      APP_VERSION_CODE: 3000002
      APK_NAME: CrazyShit-3.0.0-phase1.1-beta.1.apk
      RELEASE_TAG: v3.0.0-phase1.1-beta.1
      RELEASE_NOTES: |
        CrazyShit 3.0 Performance Phase 1.1.

        This prerelease retains the Phase 1 performance work and fixes black video thumbnails on Home. The Home parser now ignores CrazyShit's blank sizing tile and uses the real thumbnail URL directly, without restoring duplicate page requests.

        Validation:
        - 36 release unit tests passed
        - Live CrazyShit Home markup verified
        - Home parser regression fixture passed
        - Release APK signature verified
        - Macrobenchmarks passed for startup, Home, Chaos, search, creator profiles, galleries, and playback
        - Startup profile generation passed

    steps:
      - name: Check out performance branch
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android APIs 35 and 36
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Restore private release signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          raw = os.environ.get("SIGNING_BUNDLE", "").replace("\r", "").replace("\n", "")
          if not raw:
              sys.exit("Missing repository secret: ANDROID_SIGNING_BUNDLE")
          data = json.loads(raw)
          required = ["keystore_base64", "store_password", "key_alias", "key_password"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              sys.exit("Signing bundle is missing: " + ", ".join(missing))
          for key in ("store_password", "key_alias", "key_password"):
              print(f"::add-mask::{data[key]}")
          keystore = pathlib.Path(os.environ["RUNNER_TEMP"]) / "crazyshit-release.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_base64"]))
          keystore.chmod(0o600)
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"ANDROID_KEYSTORE_PATH={keystore}\n")
              output.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              output.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              output.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

      - name: Test and build signed release APK
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Verify release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$APK_NAME" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "CrazyShit 3.0 Performance Phase 1.1" \
            --notes "$RELEASE_NOTES" \
            --prerelease

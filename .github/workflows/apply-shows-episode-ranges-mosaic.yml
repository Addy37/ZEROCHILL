name: Apply Shows ranges and mosaic patch

on:
  push:
    branches:
      - feature/shows-episode-ranges-mosaic

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/shows-episode-ranges-mosaic
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply patch
        run: python tools/apply_shows_episode_ranges_mosaic.py

      - name: Remove patch scaffolding
        run: |
          rm -f tools/apply_shows_episode_ranges_mosaic.py
          rm -f .github/workflows/apply-shows-episode-ranges-mosaic.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Shows episode ranges and category mosaics"
          git push origin HEAD:feature/shows-episode-ranges-mosaic

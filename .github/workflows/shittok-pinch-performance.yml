name: ShitTok Pinch Scroll Comparison

on:
  pull_request:
    branches: [ main, rebrand/zerochill ]
    paths: [ 'app/**', '.github/workflows/shittok-pinch-performance.yml' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  short-scroll:
    if: ${{ github.head_ref == 'feature/shittok-dynamic-pinch' || github.head_ref == 'feature/smart-shittok-v2' || github.head_ref == 'hotfix/5.6.1-filtered-shittok' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANALYTICS_ENDPOINT: ""
      BASE_SHA: ${{ github.head_ref == 'hotfix/5.6.1-filtered-shittok' && '1fa925f4806d21a1cfefc6d98158ca2cb7f14a51' || github.head_ref == 'feature/smart-shittok-v2' && 'dd0fc91fdb7be88587685fd4ea3a618998b8bdea' || 'd46516d8b9319d32a926bff9e13332841e0d094f' }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare approved and candidate short scrolling on the same emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 4096M
          ram-size: 2048M
          script: bash tools/run_shittok_pinch_comparison.sh
      - name: Print frame and playback measurements
        if: always()
        run: |
          find "$RUNNER_TEMP/pinch-comparison" -type f -name '*benchmarkData.json' -print -exec cat {} \; 2>/dev/null || true
      - name: Preserve paired frames, traces and device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-pinch-scroll-comparison
          path: ${{ runner.temp }}/pinch-comparison/
          if-no-files-found: warn
          retention-days: 7

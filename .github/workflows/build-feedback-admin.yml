name: Build Private Feedback Admin APK

on:
  push:
    branches: [ main, rebrand/zerochill ]
    paths:
      - '.github/workflows/build-feedback-admin.yml'
      - 'feedbackadmin/**'
      - 'supabase/functions/feedback-admin/**'
      - 'supabase/functions/dynamic-api/**'
      - 'supabase/functions/app-config-admin/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/*source_config.sql'
      - 'supabase/migrations/*analytics.sql'
      - 'supabase/migrations/*feedback*.sql'
  workflow_dispatch:
  pull_request:
    paths:
      - 'feedbackadmin/**'
      - 'supabase/functions/feedback-admin/**'
      - 'supabase/functions/app-config-admin/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/*source_config.sql'
      - 'supabase/migrations/*analytics.sql'
      - 'settings.gradle.kts'
      - '.github/workflows/build-feedback-admin.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMIN_SOURCE_CONFIG_ENDPOINT: https://fketutffusxgjxjlckci.supabase.co/functions/v1/app-config-admin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Restore persistent signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          test -n "$SIGNING_BUNDLE" || { echo "Missing production signing bundle."; exit 1; }
          python - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ["SIGNING_BUNDLE"].replace("\r", "").replace("\n", "")
          data = json.loads(raw)
          required = ["keystore_base64", "store_password", "key_alias", "key_password"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit("Signing bundle is missing: " + ", ".join(missing))
          for key in ("store_password", "key_alias", "key_password"):
              print(f"::add-mask::{data[key]}")
          keystore = pathlib.Path(os.environ["RUNNER_TEMP"]) / "crazyshit-admin-release.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_base64"]))
          keystore.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"ANDROID_KEYSTORE_PATH={keystore}\n")
              output.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              output.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              output.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

      - name: Test and build private admin APK
        run: >-
          gradle --no-daemon
          :feedbackadmin:testDebugUnitTest
          :feedbackadmin:testReleaseUnitTest
          :feedbackadmin:assembleRelease

      - name: Prepare APK
        run: |
          cp feedbackadmin/build/outputs/apk/release/feedbackadmin-release.apk ZeroChill-Admin.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs ZeroChill-Admin.apk
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SOURCE_REF="${{ github.head_ref || github.ref_name }}"
          SAFE_REF="$(printf '%s' "$SOURCE_REF" | tr '/ ' '--')"
          cp ZeroChill-Admin.apk "ZeroChill-Admin-${SAFE_REF}-${SOURCE_SHA:0:7}-signed.apk"
          sha256sum ZeroChill-Admin.apk > ZeroChill-Admin-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-Admin
          path: |
            ZeroChill-Admin.apk
            ZeroChill-Admin-*-signed.apk
            ZeroChill-Admin-SHA256.txt
          if-no-files-found: error
          retention-days: 14

name: ZEROCHILL 7.3.0 Signed Release Candidate

on:
  push:
    branches:
      - rc-apk/zerochill-7.3.0

permissions:
  contents: read

jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      APP_VERSION_CODE: '7003000'
      APP_VERSION_NAME: '7.3.0'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify current ZEROCHILL build lineage
        run: bash tools/verify-android-build-lineage.sh
      - name: Verify release metadata and matching What’s New
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          version = pathlib.Path("RELEASE_VERSION").read_text().strip()
          assert version == os.environ["APP_VERSION_NAME"]
          major, minor, patch = map(int, version.split("."))
          assert major * 1_000_000 + minor * 1000 + patch == int(os.environ["APP_VERSION_CODE"])
          bundled = pathlib.Path("app/src/main/res/raw/whats_new_7_0.md").read_text().splitlines()
          markdown = pathlib.Path("RELEASE_NOTES.md").read_text()
          release = markdown.split("## What's new", 1)[1].split("## Updating", 1)[0].splitlines()
          assert bundled[0] == markdown.splitlines()[0] == f"# ZEROCHILL {version}"
          assert [line for line in bundled if line.startswith("- ")] == [
              line for line in release if line.startswith("- ")]
          PYTHON
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Recheck main before signing
        run: bash tools/verify-android-build-lineage.sh
      - name: Restore existing ZEROCHILL signing certificate
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              raise SystemExit("Missing existing signing bundle")
          data = json.loads(raw.replace("\r", "").replace("\n", ""))
          for key in ("keystore_base64", "store_password", "key_alias", "key_password"):
              if not data.get(key):
                  raise SystemExit("Missing signing field: " + key)
          for key in ("store_password", "key_alias", "key_password"):
              print("::add-mask::" + data[key])
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zerochill-consolidated-test.jks"
          path.write_bytes(base64.b64decode(data["keystore_base64"]))
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for key, value in {
                  "ANDROID_KEYSTORE_PATH": str(path),
                  "ANDROID_KEYSTORE_PASSWORD": data["store_password"],
                  "ANDROID_KEY_ALIAS": data["key_alias"],
                  "ANDROID_KEY_PASSWORD": data["key_password"]
              }.items():
                  out.write(key + "=" + value + "\n")
          PY
      - name: Run focused regressions
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/consolidated-tests.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  include '**/VideoSeekFeedbackTest.class',
                          '**/CreatorPlayerQolTest.class',
                          '**/OnlyFapViewerGesturesTest.class',
                          '**/HeaderProfileAvatarTest.class',
                          '**/ShowsFullscreenControlsTest.class',
                          '**/OnlyFapGalleryGlideTest.class',
                          '**/OnlyFapGalleryLayoutTest.class',
                          '**/BunkrGalleryResolutionLifecycleTest.class',
                          '**/BunkrAlbumShowsTest.class',
                          '**/ShitTokSourceModeTest.class',
                          '**/ShitTokSeenStoreTest.class',
                          '**/ShitTokContinuityTest.class',
                          '**/ShitTokFocusModeViewportTest.class',
                          '**/LegacyVideoFormatSupportTest.class',
                          '**/LegacyVlcInitializationTest.class',
                          '**/AppUpdaterInstallerTest.class',
                          '**/ShowsWatchPageTest.class',
                          '**/ShowsWatchSessionTest.class',
                          '**/WhatsNewTest.class'
                  systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                  testLogging { events 'passed', 'failed', 'skipped' }
              }
          }
          EOF
          gradle --no-daemon --console=plain --max-workers=3 -I "$RUNNER_TEMP/consolidated-tests.gradle" :app:testReleaseUnitTest
      - name: Assemble signed release APK
        timeout-minutes: 10
        run: gradle --no-daemon --console=plain --max-workers=3 :app:assembleRelease
      - name: Validate signed upgrade and package media libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate stable previous-test
          bash tools/verify-android-build-lineage.sh candidate/APK-LINEAGE.txt
          gh release download v7.2.0 --repo "$GITHUB_REPOSITORY" --pattern ZeroChill.apk --dir stable
          gh run download 44658875102 --repo "$GITHUB_REPOSITORY" --name ZEROCHILL-7.2.1-Watch-Polish-Test-2 --dir previous-test
          python3 - <<'PY'
          import pathlib, re, subprocess, zipfile, os
          bt = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools" / "35.0.0"
          new = pathlib.Path("app/build/outputs/apk/release/app-release.apk")
          old = pathlib.Path("stable/ZeroChill.apk")
          def run(*args):
              return subprocess.check_output([str(x) for x in args], text=True)
          def ident(p):
              m = re.search(r"package: name='([^']+)' versionCode='(\d+)'", run(bt / "aapt2", "dump", "badging", p))
              assert m, "Missing package/version"
              return m.group(1), int(m.group(2))
          def cert(p):
              m = re.search(r"Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)", run(bt / "apksigner", "verify", "--print-certs", p))
              assert m, "Unsigned APK or missing certificate"
              return m.group(1).lower()
          assert new.exists(), "Missing release APK"
          pkg, version = ident(new)
          old_pkg, old_version = ident(old)
          assert pkg == old_pkg == "com.addy37.crazyshitunofficial", "Application ID changed"
          approved = list(pathlib.Path("previous-test").rglob("*.apk"))
          assert len(approved) == 1, "Expected one approved phone-test APK"
          approved_pkg, approved_code = ident(approved[0])
          assert approved_pkg == pkg and approved_code == 7002011, "Wrong approved phone-test APK"
          assert version == int(os.environ["APP_VERSION_CODE"]) > max(old_version, approved_code)
          assert cert(new) == cert(old) == cert(approved[0]), "Signing certificate changed"
          generated = pathlib.Path(
              "app/build/generated/source/buildConfig/release/com/webapp/crazyshit/BuildConfig.java"
          ).read_text()
          assert f'SOURCE_REVISION = "{os.environ["GITHUB_SHA"]}"' in generated
          assert "ZEROCHILL_V7_TRAFFIC = true;" in generated
          print(f"Verified package {pkg}, production certificate, and version {version} > {old_version}, {approved_code}")
          with zipfile.ZipFile(new) as apk:
              libraries = [s for s in apk.namelist() if s.startswith("lib/") and s.endswith(".so")]
              assert any("libvlc" in s for s in libraries), "LibVLC binaries absent"
              print("LibVLC native ABIs:", sorted(set(s.split("/")[1] for s in libraries)))
          size = new.stat().st_size
          print("Signed candidate bytes:", size)
          assert size < 500_000_000, "Candidate APK too large for direct testing"
          branch = os.environ["GITHUB_REF_NAME"].replace("/", "-")
          out = pathlib.Path("candidate") / f"ZeroChill-7.3.0-RC-{branch}-{os.environ['GITHUB_SHA'][:8]}.apk"
          out.write_bytes(new.read_bytes())
          PY
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' "$GITHUB_SHA" > candidate/SOURCE_SHA.txt
      - name: Enable KVM for update test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test in-place updates and preserved app data on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/verify-730-candidate-upgrade.sh
      - name: Upload signed installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEROCHILL-7.3.0-Signed-RC
          path: candidate/
          retention-days: 14
          if-no-files-found: error

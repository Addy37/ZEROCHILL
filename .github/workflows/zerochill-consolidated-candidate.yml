name: ZEROCHILL Signed Test APK

on:
  push:
    branches:
      - test-apk/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    # Full Robolectric suite plus APK packaging can exceed 25 minutes on CI.
    timeout-minutes: 40
    env:
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      APP_VERSION_CODE: '7002011'
      APP_VERSION_NAME: '7.2.1-watch-polish-test.2'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify current ZEROCHILL build lineage
        run: bash tools/verify-android-build-lineage.sh
      - name: Set side-by-side test version
        if: startsWith(github.ref_name, 'test-apk/')
        run: |
          python3 - <<'PY'
          import os, pathlib
          major, minor, patch = map(int, pathlib.Path("RELEASE_VERSION").read_text().strip().split("."))
          version = f"{major}.{minor}.{patch + 1}-test"
          code = major * 1_000_000 + minor * 1000 + patch + 1
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"APP_VERSION_NAME={version}\nAPP_VERSION_CODE={code}\n")
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Recheck main before signing
        run: bash tools/verify-android-build-lineage.sh
      - name: Restore existing ZEROCHILL signing certificate
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              raise SystemExit("Missing existing signing bundle")
          data = json.loads(raw.replace("\r", "").replace("\n", ""))
          for key in ("keystore_base64", "store_password", "key_alias", "key_password"):
              if not data.get(key):
                  raise SystemExit("Missing signing field: " + key)
          for key in ("store_password", "key_alias", "key_password"):
              print("::add-mask::" + data[key])
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zerochill-consolidated-test.jks"
          path.write_bytes(base64.b64decode(data["keystore_base64"]))
          path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              for key, value in {
                  "ANDROID_KEYSTORE_PATH": str(path),
                  "ANDROID_KEYSTORE_PASSWORD": data["store_password"],
                  "ANDROID_KEY_ALIAS": data["key_alias"],
                  "ANDROID_KEY_PASSWORD": data["key_password"]
              }.items():
                  out.write(key + "=" + value + "\n")
          PY
      - name: Run focused regressions
        if: "!startsWith(github.ref_name, 'test-apk/')"
        timeout-minutes: 12
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/consolidated-tests.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  include '**/OnlyFapGalleryGlideTest.class',
                          '**/OnlyFapGalleryLayoutTest.class',
                          '**/BunkrGalleryResolutionLifecycleTest.class',
                          '**/BunkrAlbumShowsTest.class',
                          '**/ShitTokSourceModeTest.class',
                          '**/ShitTokSeenStoreTest.class',
                          '**/ShitTokContinuityTest.class',
                          '**/ShitTokFocusModeViewportTest.class',
                          '**/LegacyVideoFormatSupportTest.class',
                          '**/LegacyVlcInitializationTest.class',
                          '**/AppUpdaterInstallerTest.class',
                          '**/ShowsWatchPageTest.class',
                          '**/ShowsWatchSessionTest.class',
                          '**/WhatsNewTest.class'
                  systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
                  testLogging { events 'passed', 'failed', 'skipped' }
              }
          }
          EOF
          gradle --no-daemon --console=plain --max-workers=3 -I "$RUNNER_TEMP/consolidated-tests.gradle" :app:testDebugUnitTest
      - name: Test and assemble signed side-by-side beta
        if: startsWith(github.ref_name, 'test-apk/')
        run: |
          set -euo pipefail
          # ShitTok design probes need one signed APK but not the full 1,700+ class
          # suite every time. Other test branches retain the normal full run.
          if [[ "$GITHUB_REF_NAME" == "test-apk/shittok-five-feeds" ]]; then
            gradle --no-daemon --console=plain --max-workers=3 :app:testDebugUnitTest \
              --tests com.webapp.crazyshit.ShitTokCategoryStripTest \
              --tests com.webapp.crazyshit.ShitTokHeaderStyleTest \
              --tests com.webapp.crazyshit.ShitTokAmbientSamplingTest \
              --tests com.webapp.crazyshit.ShitTokFullscreenAccentTest \
              --tests com.webapp.crazyshit.NavigationIaTest \
              --tests com.webapp.crazyshit.NavigationResponsivenessTest \
              --tests com.webapp.crazyshit.VisualRefreshTest \
              --tests com.webapp.crazyshit.ShitTokContentPreferenceTest \
              --tests com.webapp.crazyshit.ShitTokCategoryHandoffTest \
              --tests com.webapp.crazyshit.ShitTokPosterFramingTest \
              --tests com.webapp.crazyshit.ShitTokFeedSessionStoreTest \
              --tests com.webapp.crazyshit.ShitTokCategoryReturnCacheTest \
              --tests com.webapp.crazyshit.ShitTokWarmCategoryCacheTest \
              --tests com.webapp.crazyshit.ShitTokFeedSourcesTest \
              --tests com.webapp.crazyshit.ShitTokFiveFeedInventoryTest \
              --tests com.webapp.crazyshit.ShitTokFilteredInventoryTest \
              --tests com.webapp.crazyshit.ShitTokSourceModeTest \
              --tests com.webapp.crazyshit.ShitTokOrientationTest \
              --tests com.webapp.crazyshit.ShitTokOrientationAdmissionTest \
              --tests com.webapp.crazyshit.ShitTokAspectPriorityTest \
              --tests com.webapp.crazyshit.GlassHeaderLayoutTest \
              --tests com.webapp.crazyshit.BottomNavigationInsetsTest
            gradle --no-daemon --console=plain --max-workers=3 :app:assembleDebug
          else
            gradle --no-daemon --console=plain --max-workers=3 :app:testDebugUnitTest :app:assembleDebug
          fi
          mkdir -p candidate
          bash tools/verify-android-build-lineage.sh candidate/APK-LINEAGE.txt
          apk="candidate/ZeroChill-Beta-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA:0:8}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/beta-badging.txt"
          grep "package: name='com.addy37.crazyshitunofficial.dev'" "$RUNNER_TEMP/beta-badging.txt"
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload signed side-by-side test APK
        if: startsWith(github.ref_name, 'test-apk/')
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-signed-beta
          path: candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Assemble signed release APK
        if: "!startsWith(github.ref_name, 'test-apk/')"
        timeout-minutes: 10
        run: gradle --no-daemon --console=plain --max-workers=3 :app:assembleRelease
      - name: Validate signed upgrade and package media libraries
        if: "!startsWith(github.ref_name, 'test-apk/')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate stable
          bash tools/verify-android-build-lineage.sh candidate/APK-LINEAGE.txt
          gh release download v7.2.0 --repo "$GITHUB_REPOSITORY" --pattern ZeroChill.apk --dir stable
          python3 - <<'PY'
          import pathlib, re, subprocess, zipfile, os
          bt = pathlib.Path(os.environ["ANDROID_HOME"]) / "build-tools" / "35.0.0"
          new = pathlib.Path("app/build/outputs/apk/release/app-release.apk")
          old = pathlib.Path("stable/ZeroChill.apk")
          def run(*args):
              return subprocess.check_output([str(x) for x in args], text=True)
          def ident(p):
              m = re.search(r"package: name='([^']+)' versionCode='(\d+)'", run(bt / "aapt2", "dump", "badging", p))
              assert m, "Missing package/version"
              return m.group(1), int(m.group(2))
          def cert(p):
              m = re.search(r"Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)", run(bt / "apksigner", "verify", "--print-certs", p))
              assert m, "Unsigned APK or missing certificate"
              return m.group(1).lower()
          assert new.exists(), "Missing release APK"
          pkg, version = ident(new)
          old_pkg, old_version = ident(old)
          assert pkg == old_pkg == "com.addy37.crazyshitunofficial", "Application ID changed"
          assert version == 7002011 and version > max(old_version, 7002010), "Candidate cannot upgrade installed version"
          assert cert(new) == cert(old), "Signing certificate changed"
          with zipfile.ZipFile(new) as apk:
              libraries = [s for s in apk.namelist() if s.startswith("lib/") and s.endswith(".so")]
              assert any("libvlc" in s for s in libraries), "LibVLC binaries absent"
              print("LibVLC native ABIs:", sorted(set(s.split("/")[1] for s in libraries)))
          size = new.stat().st_size
          print("Signed candidate bytes:", size)
          assert size < 500_000_000, "Candidate APK too large for direct testing"
          branch = os.environ["GITHUB_REF_NAME"].replace("/", "-")
          out = pathlib.Path("candidate") / f"ZeroChill-7.2.1-watch-polish-{branch}-{os.environ['GITHUB_SHA'][:8]}.apk"
          out.write_bytes(new.read_bytes())
          PY
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' "$GITHUB_SHA" > candidate/SOURCE_SHA.txt
      - name: Upload signed installable test APK
        if: "!startsWith(github.ref_name, 'test-apk/')"
        uses: actions/upload-artifact@v4
        with:
          name: ZEROCHILL-7.2.1-Watch-Polish-Test-2
          path: candidate/
          retention-days: 14
          if-no-files-found: error

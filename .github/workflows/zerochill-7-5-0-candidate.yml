name: ZEROCHILL 7.5 Signed Release Candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: zerochill-7-5-0-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    if: >-
      github.repository == 'Addy37/ZEROCHILL' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'release/zerochill-7.5.0-preparation' ||
       (github.event.pull_request.number == 506 && github.head_ref == 'fix/pawchive-mixed-media'))
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event.pull_request.number == 506 && '["release","debug"]' || '["release"]') }}
    env:
      ZEROCHILL_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      ZEROCHILL_SOURCE_BRANCH: ${{ github.head_ref }}
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current main and declare release metadata
        run: |
          bash tools/verify-android-build-lineage.sh "$RUNNER_TEMP/BUILD_LINEAGE.txt"
          version=$(cat RELEASE_VERSION)
          code=$(cat RELEASE_VERSION_CODE)
          python3 tools/verify_release_7_5_notes.py "$version" "$code"
          printf 'APP_VERSION_NAME=%s\nAPP_VERSION_CODE=%s\n' "$version" "$code" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Reuse verified phone APK for emulator-only changes
        id: reuse
        if: matrix.variant == 'release' && env.APP_VERSION_NAME == '7.5.0'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_APK_SOURCE: 7a28dd47ac0b0342bfba989c738211007ffe5664
        run: |
          set -euo pipefail
          if git diff --quiet "$VERIFIED_APK_SOURCE" HEAD -- . \
              ':(exclude).github/workflows/zerochill-7-5-0-candidate.yml' \
              ':(exclude)tools/test_release_7_5_upgrade.sh' \
              ':(exclude)tools/verify_release_upgrade.py' \
              ':(exclude)RELEASE_HANDOFF_7.5.md' \
              ':(exclude)docs/ZEROCHILL_7_5_RELEASE_PREPARATION.md' \
            && gh run download 45928943983 --repo "$GITHUB_REPOSITORY" \
                 --name "ZeroChill-7.5.0-candidate-signed-$VERIFIED_APK_SOURCE" --dir reused-candidate; then
            (cd reused-candidate && sha256sum -c SHA256SUMS.txt)
            python3 - <<'PYVERIFY'
          import json, os, pathlib
          report = json.loads(pathlib.Path("reused-candidate/VALIDATION.json").read_text())
          assert report["source_sha"] == os.environ["VERIFIED_APK_SOURCE"]
          assert report["sha256"] == "a6f5d5c9188df32204b56d520901f59ff08f58b686416f16ec2de01fb7423b35"
          assert report["upgrade_eligible"]
          PYVERIFY
            apk=$(find reused-candidate -maxdepth 1 -name '*.apk' -print)
            test -n "$apk"
            printf 'CANDIDATE_APK=%s/%s\n' "$GITHUB_WORKSPACE" "$apk" >> "$GITHUB_ENV"
            echo 'reused=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Download public upgrade baselines
        if: matrix.variant == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$APP_VERSION_NAME" == 7.5.1 ]]; then
            baselines=(7.5.0)
          else
            baselines=(7.4.0 7.3.0)
          fi
          for baseline in "${baselines[@]}"; do
            gh release download "v$baseline" --repo "$GITHUB_REPOSITORY" --pattern ZeroChill.apk --dir "$RUNNER_TEMP/$baseline"
          done
      - name: Restore production signing credentials
        if: matrix.variant == 'release' && steps.reuse.outputs.reused != 'true'
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get('SIGNING_BUNDLE', '')
          if not raw:
              raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data = json.loads(raw.replace('\r','').replace('\n',''))
          for key in ('keystore_base64','store_password','key_alias','key_password'):
              if not data.get(key):
                  raise SystemExit('Missing signing item: ' + key)
          for key in ('store_password','key_alias','key_password'):
              print('::add-mask::' + data[key])
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'zerochill-7-5-0-candidate.jks'
          path.write_bytes(base64.b64decode(data['keystore_base64']))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for key, value in {
                  'ANDROID_KEYSTORE_PATH': str(path),
                  'ANDROID_KEYSTORE_PASSWORD': data['store_password'],
                  'ANDROID_KEY_ALIAS': data['key_alias'],
                  'ANDROID_KEY_PASSWORD': data['key_password']
              }.items():
                  out.write(key+'='+value+'\n')
          PY
      - name: Run focused phone-candidate regressions and assemble one signed APK
        if: matrix.variant == 'release' && env.APP_VERSION_NAME == '7.5.0' && steps.reuse.outputs.reused != 'true'
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:testReleaseUnitTest
          --tests '*ShitTokInteractionUiTest'
          --tests '*ShitTokProgressTest'
          --tests '*ShitTokDynamicPinchTest'
          --tests '*ShitTokAudioOwnershipTest'
          --tests '*ShitTokFullscreenAccentTest'
          --tests '*ShitTokVisualPolishTest'
          --tests '*ShitTokScrubInteractionTest'
          --tests '*ShitTokSpeedMuteTest'
          --tests '*ShowsFullscreenControlsTest'
          --tests '*VideoSeekFeedbackTest'
          --tests '*ZeroChillPushRegistrationTest'
          --tests '*ConversationCleanupUiTest'
          --tests '*CreatorBackupTest'
          --tests '*MediaCollectionStoreTest'
          --tests '*PlayerSaveMenuTest'
          --tests '*MoreMenuLayoutTest'
          --tests '*SupportZeroChillDialogTest'
          --tests '*WhatsNewTest'
          --tests '*ReleaseNotesSummaryTest'
          --tests '*StartupWizardUiTest'
          --tests '*SpotlightSearchTest'
          :app:assembleRelease
      - name: Run complete 7.5.1 debug unit suite
        if: matrix.variant == 'debug'
        run: gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 :app:testDebugUnitTest
      - name: Run complete 7.5.1 release unit suite and assemble one signed APK
        if: matrix.variant == 'release' && env.APP_VERSION_NAME == '7.5.1'
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:testReleaseUnitTest :app:assembleRelease
      - name: Remove signing material
        if: always() && matrix.variant == 'release'
        run: rm -f "$RUNNER_TEMP/zerochill-7-5-0-candidate.jks"
      - name: Verify production identity, packaged notes, backend configuration and exact source
        if: matrix.variant == 'release' && steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          mkdir -p candidate
          safe_ref="${ZEROCHILL_SOURCE_BRANCH//\//-}"
          apk="candidate/ZeroChill-${APP_VERSION_NAME}-${safe_ref}-${ZEROCHILL_SOURCE_SHA:0:7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          previous_version=7.4.0
          previous_code=7004000
          approved_code=7005080
          if [[ "$APP_VERSION_NAME" == 7.5.1 ]]; then
            previous_version=7.5.0
            previous_code=7005085
            approved_code=7005090
          fi
          python3 tools/verify_release_candidate.py --apk "$apk" --previous "$RUNNER_TEMP/$previous_version/ZeroChill.apk" \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" --source-sha "$ZEROCHILL_SOURCE_SHA" \
            --source-branch "$ZEROCHILL_SOURCE_BRANCH" --version "$APP_VERSION_NAME" --code "$APP_VERSION_CODE" \
            --previous-version "$previous_version" --previous-code "$previous_code" --approved-code "$approved_code" \
            --verify-bundled-notes --output candidate/VALIDATION.json
          cp "$RUNNER_TEMP/BUILD_LINEAGE.txt" candidate/
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
          printf 'CANDIDATE_APK=%s/%s\n' "$GITHUB_WORKSPACE" "$apk" >> "$GITHUB_ENV"
      - name: Upload signed phone-test APK and checksum
        if: matrix.variant == 'release' && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-${{ env.APP_VERSION_NAME }}-candidate-signed-${{ env.ZEROCHILL_SOURCE_SHA }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM for Android upgrade tests
        if: matrix.variant == 'release'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install signed APKs and verify retained data and onboarding
        if: matrix.variant == 'release'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash tools/test_release_7_5_upgrade.sh
      - name: Upload test and upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-${{ env.APP_VERSION_NAME }}-${{ matrix.variant == 'debug' && 'debug-' || '' }}test-evidence-${{ env.ZEROCHILL_SOURCE_SHA }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testReleaseUnitTest/
            upgrade-results/
          if-no-files-found: warn
          retention-days: 14

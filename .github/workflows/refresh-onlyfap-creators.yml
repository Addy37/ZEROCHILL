name: Validate OnlyFap Creator Catalog

on:
  pull_request:
    branches:
      - rebrand/zerochill
    paths:
      - tools/refresh_onlyfap_creator_index.py
      - app/src/main/assets/source_config_defaults.json
      - app/src/main/assets/onlyfap_creators.tsv
      - .github/workflows/refresh-onlyfap-creators.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onlyfap-creator-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out current ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate catalog tool syntax
        run: python3 -m py_compile tools/refresh_onlyfap_creator_index.py

      - name: Refresh source-confirmed creator names
        id: refresh
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/refresh_onlyfap_creator_index.py \
            --target 20000 \
            --min-count 15000 \
            --page-size 50 \
            --pause 0.10 \
            --max-requests 1000 \
            --common-crawl-crawls 6 \
            --common-crawl-max-pages 20 \
            --common-crawl-pause 1.0 \
            --onlyhaven-max-requests 100

      - name: Upload generated catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlyfap-creator-catalog
          path: app/src/main/assets/onlyfap_creators.tsv
          if-no-files-found: error
          retention-days: 7

      - name: Require successful refresh
        if: steps.refresh.outcome != 'success'
        run: exit 1

      - name: Verify catalog size
        run: |
          set -euo pipefail
          COUNT="$(grep -v '^#' app/src/main/assets/onlyfap_creators.tsv | sed '/^$/d' | wc -l)"
          echo "Bundled creators: $COUNT"
          test "$COUNT" -ge 15000

      - name: Run focused search tests
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'com.webapp.crazyshit.BundledCreatorIndexTest'

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zerochill-onlyfap-catalog-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

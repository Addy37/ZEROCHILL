name: Apply XMegaDrive Physical Gesture Bridge

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/zerochill-notifications-5.3.0
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Apply physical gesture bridge
        env:
          PATCH_B64: " BcXCgqP1xuICAgIFx9XG5cbiAgICBwcml2YXRlIHN0YXRpYyBib29sZWFuIHBlcm1hbmVudGx5QmxvY2tlZCIudHJpbSgpLnJlcGxhY2UoIiAiLCIiKSwKICAgIHJlLlMsCikK
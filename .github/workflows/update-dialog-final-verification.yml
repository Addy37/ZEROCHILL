name: ZEROCHILL popup regression verification
on:
  push:
    branches:
      - fix/whats-new-scroll-2026-11
    paths:
      - .github/workflows/update-dialog-final-verification.yml
permissions:
  contents: read
jobs:
  popup-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_VERSION_CODE: '7000013'
      APP_VERSION_NAME: '7.0.4-popup-test'
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: unit-test-only-placeholder
      FEEDBACK_ANON_KEY: unit-test-only-placeholder
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Focused popup Debug tests
        run: |
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 :app:testDebugUnitTest --tests '*UpdateCardOverflowTest.shortUpdateStaysCompactInsteadOfFillingTheScreen'
      - name: Focused popup Release tests
        if: false
        run: |
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 :app:testReleaseUnitTest --tests '*WhatsNewTest' --tests '*ReleaseNotesSummaryTest' --tests '*UpdateCardControllerTest' --tests '*UpdateCardOverflowTest'
      - name: Upload focused test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popup-final-verification-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testReleaseUnitTest/
          retention-days: 7
          if-no-files-found: ignore

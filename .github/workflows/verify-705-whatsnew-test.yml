name: 7.0.5 What's New Test Fix Verification

on:
  push:
    branches: [fix/zerochill-7.0.5-whatsnew-test]

permissions:
  contents: read

jobs:
  focused-release-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      APP_VERSION_CODE: '7000005'
      APP_VERSION_NAME: '7.0.5'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Run corrected What's New tests on release variant
        run: >-
          gradle --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:testReleaseUnitTest
          --tests 'com.webapp.crazyshit.WhatsNewTest'
          --tests 'com.webapp.crazyshit.ReleaseNotesSummaryTest'

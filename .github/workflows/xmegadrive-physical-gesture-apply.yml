name: Apply XMegaDrive Physical Gesture Bridge

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/zerochill-notifications-5.3.0
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Apply source patch
        run: python3 tools/xmegadrive_physical_patch.py

      - name: Verify no generated activation remains
        run: |
          ! grep -q 'dispatchNativeTap' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'MotionEvent.obtain' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          ! grep -q 'triggerNativeAgeContinue' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java

      - name: Run focused XMegaDrive tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest --tests com.webapp.crazyshit.XMegaDriveAgePromptTest

      - name: Commit physical gesture bridge
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java app/src/test/java/com/webapp/crazyshit/XMegaDriveAgeGateSafetyTest.java
          git diff --cached --quiet && exit 0
          git commit -m 'Route XMegaDrive age confirmation through physical touch'
          git push origin HEAD:feature/zerochill-notifications-5.3.0

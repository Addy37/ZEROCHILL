name: PR423 New Message Signed Beta Candidate

# No automatic Actions spend: start manually only when approved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.ref_name == 'feature/zerochill-7-new-message-compose'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      # Existing New Zerochill PUBLIC client key; never a service-role credential.
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      APP_VERSION_CODE: '6000047'
      APP_VERSION_NAME: '7.0-traffic-test.2'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify selected lineage
        run: git merge-base --is-ancestor 88b60e38a9516bfa52b277e7f079d2eda9337780 HEAD
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Restore production signing credentials
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get('SIGNING_BUNDLE', '')
          if not raw:
              raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data = json.loads(raw.replace('\r','').replace('\n',''))
          for key in ('keystore_base64','store_password','key_alias','key_password'):
              if not data.get(key):
                  raise SystemExit('Missing signing item: ' + key)
          for key in ('store_password','key_alias','key_password'):
              print('::add-mask::' + data[key])
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'shows-416.jks'
          path.write_bytes(base64.b64decode(data['keystore_base64']))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for key, value in {
                  'ANDROID_KEYSTORE_PATH': str(path),
                  'ANDROID_KEYSTORE_PASSWORD': data['store_password'],
                  'ANDROID_KEY_ALIAS': data['key_alias'],
                  'ANDROID_KEY_PASSWORD': data['key_password']
              }.items():
                  out.write(key+'='+value+'\n')
          PY
      - name: Run focused DM test and build signed side-by-side APK
        run: gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 :app:testDebugUnitTest --tests 'com.webapp.crazyshit.ZeroChillMessageThreadUiTest' :app:assembleDebug
      - name: Verify certificate, package and backend isolation
        run: |
          set -euo pipefail
          mkdir -p candidate
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          APK="candidate/ZeroChill-${SAFE_REF}-${GITHUB_SHA:0:7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          python3 tools/verify_traffic_candidate.py "$APK" "$ANDROID_HOME/build-tools/35.0.0"
          cp docs/ZEROCHILL_7_ANDROID_TRAFFIC_REDUCTION.md candidate/
          cp docs/ZEROCHILL_7_NEW_MESSAGE_TESTBOT.md candidate/
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-PR423-signed-new-message-beta
          path: candidate/
          if-no-files-found: error
          retention-days: 14

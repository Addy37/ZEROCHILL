name: Bunkr Search and Playback Repair Beta

# One isolated side-by-side candidate build. Never publish or merge automatically.
on:
  push:
    branches:
      - fix/bunkr-2026-11-search-playback-recovery
    paths:
      - .github/workflows/bunkr-search-playback-beta.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bunkr-beta:
    if: github.ref_name == 'fix/bunkr-2026-11-search-playback-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      APP_VERSION_CODE: '7000005'
      APP_VERSION_NAME: '7.0.4-bunkr-beta.1'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Confirm tested source descends from 7.0.4
        run: |
          git merge-base --is-ancestor c4b9ad45fdacdb28347eb6ba7c369870006b3b23 HEAD
          test -f docs/ZEROCHILL_7_NEW_SUPABASE_ROUTING.md
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK and build tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Run focused Bunkr and gallery regressions
        run: |
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 \
            :app:testDebugUnitTest \
            --tests '*BunkrResolutionTest' \
            --tests '*BunkrGalleryMediaGuardTest' \
            --tests '*SearchScopeTest' \
            --tests '*PlaybackRecoveryListenerTest'
      - name: Restore original signing for a side-by-side beta
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ.get('SIGNING_BUNDLE', '')
          if not raw:
              raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data = json.loads(raw.replace('\r','').replace('\n',''))
          for key in ('keystore_base64','store_password','key_alias','key_password'):
              if not data.get(key): raise SystemExit('Signing item missing: ' + key)
          for key in ('store_password','key_alias','key_password'):
              print('::add-mask::' + data[key])
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bunkr-beta.jks'
          path.write_bytes(base64.b64decode(data['keystore_base64']))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for key, val in {
                  'ANDROID_KEYSTORE_PATH': str(path),
                  'ANDROID_KEYSTORE_PASSWORD': data['store_password'],
                  'ANDROID_KEY_ALIAS': data['key_alias'],
                  'ANDROID_KEY_PASSWORD': data['key_password']
              }.items(): out.write(key + '=' + val + '\n')
          PY
      - name: Assemble one signed debug beta APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify separate beta app ID, signing, backend and source
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p candidate
          python3 - "$APK" "$ANDROID_HOME/build-tools/35.0.0" <<'PY'
          import os, pathlib, re, subprocess, sys
          apk, tools = sys.argv[1:]
          def output(*args):
              return subprocess.check_output(args, text=True)
          badge = output(str(pathlib.Path(tools)/'aapt2'), 'dump', 'badging', apk)
          package = re.search(r"package: name='([^']+)' versionCode='(\d+)'", badge)
          assert package and package[1] == 'com.addy37.crazyshitunofficial.dev', 'Incorrect beta package'
          assert int(package[2]) == 7000005, 'Incorrect beta version'
          cert = output(str(pathlib.Path(tools)/'apksigner'), 'verify', '--print-certs', apk)
          digest = re.search(r'Signer #1 certificate SHA-256 digest: ([a-f0-9]+)', cert)
          assert digest and digest[1] == '04abf84b3d468cbb1a562dea83b0007e686b2e56018cce911223963faea51356', 'Incorrect signing key'
          config = pathlib.Path('app/build/generated/source/buildConfig/debug/com/webapp/crazyshit/BuildConfig.java').read_text()
          assert 'ZEROCHILL_V7_TRAFFIC = true;' in config, 'V7 traffic disabled'
          assert 'https://aavjpykssueavbseqdlf.supabase.co' in config, 'Wrong backend'
          assert 'ANALYTICS_ENDPOINT = "";' in config, 'Legacy analytics enabled'
          assert 'ANALYTICS_V2_ENDPOINT = "";' in config, 'Legacy analytics enabled'
          assert os.environ['GITHUB_SHA'] in config, 'Source commit missing'
          print('Bunkr beta verified: side-by-side package, production signing, New Zerochill backend, source revision')
          PY
          NAME="ZeroChill-BunkrBeta-${GITHUB_SHA:0:7}.apk"
          cp "$APK" "candidate/$NAME"
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload private beta APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-Bunkr-Repair-Beta
          path: candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Bunkr-Repair-Unit-Test-Reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

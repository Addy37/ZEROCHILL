name: ZEROCHILL OnlyFap Creator Accuracy Signed Test APK

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: onlyfap-creator-accuracy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    if: >-
      github.repository == 'Addy37/ZEROCHILL' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/onlyfap-creator-accuracy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION_CODE: '7003006'
      APP_VERSION_NAME: '7.3.1-test.onlyfap-creator-recovery'
      ZEROCHILL_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      ZEROCHILL_SOURCE_BRANCH: ${{ github.head_ref }}
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current main and PR #463 lineage
        run: |
          git merge-base --is-ancestor 5b8de025ea4237fb6422c28fb20d9b3e1a35538c HEAD
          bash tools/verify-android-build-lineage.sh "$RUNNER_TEMP/BUILD_LINEAGE.txt"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Test creator matching, galleries, source compatibility and approved navigation
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:testReleaseUnitTest
          --tests '*Creator*Test'
          --tests '*OnlyFap*Test'
          --tests '*OnlyHaven*Test'
          --tests '*WikiFeet*Test'
          --tests '*FapelloRepositoryTest'
          --tests '*BunkrIndexSearchTest'
          --tests '*FavoriteImageNavigationTest'
          --tests '*RemoteSourceConfigManagerTest'
          --tests '*PrimaryTab*Test'
          --tests '*BottomNavigationInsetsTest'
          --tests '*LibraryProfileTest'
          --tests '*NavigationMotionControllerTest'
          :app:assembleDebug :feedbackadmin:testReleaseUnitTest :feedbackadmin:assembleDebug

      - name: Restore production signing credentials
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib

          bundle = os.environ.get('SIGNING_BUNDLE', '')
          if not bundle:
              raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data = json.loads(bundle.replace('\r', '').replace('\n', ''))
          for key in ('keystore_base64', 'store_password', 'key_alias', 'key_password'):
              if not data.get(key):
                  raise SystemExit('Missing signing item: ' + key)
          for key in ('store_password', 'key_alias', 'key_password'):
              print('::add-mask::' + data[key])

          keystore = pathlib.Path(os.environ['RUNNER_TEMP']) / 'onlyfap-creator-accuracy.jks'
          keystore.write_bytes(base64.b64decode(data['keystore_base64'], validate=True))
          keystore.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in {
                  'ANDROID_KEYSTORE_PATH': str(keystore),
                  'ANDROID_KEYSTORE_PASSWORD': data['store_password'],
                  'ANDROID_KEY_ALIAS': data['key_alias'],
                  'ANDROID_KEY_PASSWORD': data['key_password'],
              }.items():
                  output.write(key + '=' + value + '\n')
          PY
      - name: Assemble production-signed test APK
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:assembleRelease

      - name: Verify upgrade identity and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tools/verify-android-build-lineage.sh "$RUNNER_TEMP/BUILD_LINEAGE.txt"
          mkdir -p candidate "$RUNNER_TEMP/stable"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern ZeroChill.apk --dir "$RUNNER_TEMP/stable"
          SAFE_BRANCH="${ZEROCHILL_SOURCE_BRANCH//\//-}"
          CANDIDATE_APK="candidate/ZeroChill-${APP_VERSION_NAME}-${SAFE_BRANCH}-${ZEROCHILL_SOURCE_SHA:0:7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$CANDIDATE_APK"
          export CANDIDATE_APK
          python3 - <<'PY'
          import os, pathlib, re, subprocess

          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0'

          def inspect(apk):
              badging = subprocess.check_output([tools / 'aapt2', 'dump', 'badging', apk], text=True)
              package = re.search(r"package: name='([^']+)' versionCode='(\d+)'", badging)
              assert package, 'Missing package metadata'
              certs = subprocess.check_output([tools / 'apksigner', 'verify', '--print-certs', apk], text=True)
              certificate = re.search(r'Signer #1 certificate SHA-256 digest: (\w+)', certs)
              assert certificate, 'Missing signing certificate'
              return package[1], int(package[2]), certificate[1]

          candidate = inspect(os.environ['CANDIDATE_APK'])
          stable = inspect(pathlib.Path(os.environ['RUNNER_TEMP']) / 'stable' / 'ZeroChill.apk')
          assert candidate[0] == stable[0] == 'com.addy37.crazyshitunofficial', 'Incorrect app package'
          assert candidate[1] == int(os.environ['APP_VERSION_CODE']), 'Incorrect candidate version'
          assert candidate[1] > max(stable[1], 7003005), 'Candidate cannot upgrade the installed version'
          assert candidate[2] == stable[2] == '04abf84b3d468cbb1a562dea83b0007e686b2e56018cce911223963faea51356', 'Incorrect signing identity'

          generated = pathlib.Path('app/build/generated/source/buildConfig/release/com/webapp/crazyshit/BuildConfig.java')
          config = generated.read_text()
          revision = os.environ['ZEROCHILL_SOURCE_SHA']
          assert f'SOURCE_REVISION = "{revision}";' in config, 'Incorrect source revision'
          assert 'ZEROCHILL_V7_TRAFFIC = true;' in config, 'Missing ZEROCHILL 7 traffic mode'
          for field in ('ACCOUNT_SUPABASE_URL', 'SOURCE_CONFIG_ENDPOINT', 'FEEDBACK_ENDPOINT'):
              assert f'{field} = "https://aavjpykssueavbseqdlf.supabase.co' in config, f'Incorrect {field}'
          for field in ('ANALYTICS_ENDPOINT', 'ANALYTICS_V2_ENDPOINT'):
              assert f'{field} = "";' in config, f'{field} enabled on test build'

          report = (f'Source: {revision}\n'
                    f'Branch: {os.environ["ZEROCHILL_SOURCE_BRANCH"]}\n'
                    f'Application ID: {candidate[0]}\n'
                    f'Version code: {candidate[1]}\n'
                    f'Latest stable version code: {stable[1]}\n'
                    f'Certificate SHA-256: {candidate[2]}\n'
                    'Production package, certificate, version and source checks passed.\n'
                    'Phone testing is pending.\n')
          pathlib.Path('candidate/VALIDATION.txt').write_text(report)
          print(report)
          PY
          cp "$RUNNER_TEMP/BUILD_LINEAGE.txt" candidate/
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload signed APK for phone testing
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-OnlyFap-Creator-Accuracy-Signed-${{ env.ZEROCHILL_SOURCE_SHA }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-OnlyFap-Creator-Accuracy-Tests-${{ env.ZEROCHILL_SOURCE_SHA }}
          path: |
            app/build/test-results/testReleaseUnitTest/
            feedbackadmin/build/test-results/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 14

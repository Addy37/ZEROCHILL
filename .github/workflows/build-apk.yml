      # this audit can become a hard gate for new issues.
      - name: Run Android lint audit
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Upload lint report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Test and build debug and release APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease

      - name: Summarize UI regression checks
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E,base64
          for suite in ('testDebugUnitTest', 'testReleaseUnitTest'):
              for path in pathlib.Path('app/build/test-results', suite).glob('TEST-*.xml'):
                  root=E.parse(path).getroot()
                  print('TEST_SUMMARY', suite, root.attrib)
                  for failure in root.iter('failure'): print((failure.text or '')[:6000])
          image=pathlib.Path('app/build/reports/visual-tests/home-lifecycle.png')
          if image.exists(): print('UI_RENDER_HOME='+base64.b64encode(image.read_bytes()).decode())
          PY

      - name: Upload regression test results
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-tests
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native screen renders
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-visual-checks
          path: app/build/reports/visual-tests/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK with build lineage
        id: apk_lineage
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SAFE_REF="$(printf '%s' "$REF_NAME" | tr '/ ' '--' | tr -cd 'A-Za-z0-9._-')"
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SHORT_SHA="${SOURCE_SHA:0:7}"
          DEBUG_APK="ZeroChill-${SAFE_REF}-${SHORT_SHA}-debug.apk"
          RELEASE_APK="ZeroChill-${SAFE_REF}-${SHORT_SHA}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_APK"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "Built from $REF_NAME @ $SHORT_SHA"

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-debug
          path: ${{ steps.apk_lineage.outputs.debug_apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-release
          path: ${{ steps.apk_lineage.outputs.release_apk }}
          if-no-files-found: error
          retention-days: 14

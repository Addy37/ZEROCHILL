name: Build Android APK

on:
  push:
    branches: [ main, rebrand/zerochill ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.head_ref == 'feature/onlyfap-gender-shelves' || github.head_ref == 'fix/library-startup-navigation' || github.head_ref == 'feature/onlyfap-liquid-rift' || github.head_ref == 'feature/zerochill-5.1.0' || github.head_ref == 'feature/source-contracts-preference-search' }}

permissions:
  contents: write

jobs:
  cancel-superseded-native-5-1:
    if: github.head_ref == 'feature/shows-episode-list' || github.head_ref == 'feature/zerochill-5.1.0' || github.head_ref == 'feature/onlyfap-gender-shelves'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Stop obsolete CI work for this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_BRANCH: ${{ github.head_ref }}
        run: |
          gh api --method GET "repos/$GH_REPO/actions/runs" -f branch="$CANDIDATE_BRANCH" -f per_page=100 \
            --jq ".workflow_runs[] | select(.id < $CURRENT_RUN and .head_sha != \"$CURRENT_SHA\" and (.status == \"queued\" or .status == \"in_progress\")) | .id" |
          while read -r run_id; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel" || true
          done
  build:
    runs-on: ubuntu-latest
    env:
      ZEROCHILL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
      FEEDBACK_ANON_KEY: ${{ secrets.FEEDBACK_ANON_KEY }}
      SOURCE_CONFIG_ENDPOINT: https://fketutffusxgjxjlckci.supabase.co/functions/v1/app-config
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FEEDBACK_ANON_KEY }}
      # CI/test artifacts must never write to production analytics.
      ANALYTICS_ENDPOINT: ""
      SHITTOK_POOL_DIAGNOSTICS: "true"

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify current ZEROCHILL build lineage
        run: |
          set -euo pipefail
          BASELINE="8dad094162bef8b537daa9474e8cd647f55e910b"
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test -f ZEROCHILL_BUILD_LINEAGE.md
          git merge-base --is-ancestor "$BASELINE" "$SOURCE_SHA" || {
            echo "This branch predates the approved complete ZEROCHILL baseline $BASELINE."
            echo "Build from integration/zerochill-current or a descendant instead."
            exit 1
          }

      - name: Verify 2.8 compatibility cleanup
        run: |
          set -euo pipefail
          if grep -R -n -E 'PAGE_TRENDING|PAGE_MEMES|NAV_TRENDING|NAV_MEMES|ChaosPortraitPolish|SeriesCategoriesNavController|VideoDetailControllerPolish|VideoDetailImmersivePolish' app/src/main/java; then
            echo "Obsolete 2.7 compatibility plumbing was reintroduced."
            exit 1
          fi
          grep -q 'NAV_SERIES = 2' app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java
          grep -q 'NAV_CATEGORIES = 3' app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java
          grep -q 'NativeContentItem.KIND_MEDIA.equals(item.kind)' app/src/main/java/com/webapp/crazyshit/ChaosFeedView.java

      - name: Verify ZeroChill rebrand guardrails
        run: |
          set -euo pipefail
          grep -q '<string name="app_name">ZeroChill</string>' app/src/main/res/values/strings.xml
          grep -q '<string name="zerochill_tagline">NO LIMITS. ALL CONTENT.</string>' app/src/main/res/values/zerochill_brand.xml
          grep -q 'PRIMARY = Color.rgb(8, 146, 208)' app/src/main/java/com/webapp/crazyshit/UiPalette.java
          grep -q 'applicationId = "com.addy37.crazyshitunofficial"' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".dev"' app/build.gradle.kts
          grep -q 'applicationId = "com.addy37.crazyshitadmin"' feedbackadmin/build.gradle.kts
          grep -q 'android:label="ZeroChill Admin"' feedbackadmin/src/main/AndroidManifest.xml
          grep -q 'setContentView(R.layout.activity_splash)' app/src/main/java/com/webapp/crazyshit/SplashActivity.java
          if grep -q -E 'MAX_OVERLAY_MS|content.addView\(overlay' app/src/main/java/com/webapp/crazyshit/ChaosStartupOverlayController.java; then
            echo 'ShitTok must not cover the shell while waiting for media.'
            exit 1
          fi
          grep -q 'android:windowSplashScreenAnimatedIcon">@drawable/ic_zerochill_devil' app/src/main/res/values-v31/themes.xml
          grep -q 'android:windowSplashScreenAnimatedIcon">@drawable/splash_system_icon_transparent' app/src/main/res/values-v31/themes.xml
          grep -A5 'android:text="ZERO"' app/src/main/res/layout/activity_splash.xml | grep -q 'android:textColor="#F3F4F6"'
          grep -A5 'android:text="CHILL"' app/src/main/res/layout/activity_splash.xml | grep -q 'android:textColor="@color/zc_cyan"'
          if grep -q -E 'CrazyShit Admin|ZeroFilter Admin|Live overview of CrazyShit|Live overview of ZeroFilter' feedbackadmin/src/main/java/com/addy37/crazyshitadmin/MainActivity.java; then
            echo "Legacy public admin branding was reintroduced."
            exit 1
          fi
          if grep -E -n 'ZeroFilter' \
            app/src/main/java/com/webapp/crazyshit/AppUpdater.java \
            app/src/main/java/com/webapp/crazyshit/ContentUpdateWorker.java \
            app/src/main/java/com/webapp/crazyshit/MainActivity.java \
            app/src/main/java/com/webapp/crazyshit/NotificationCoordinator.java \
            app/src/main/java/com/webapp/crazyshit/RatingFeedbackPrompt.java \
            app/src/main/java/com/webapp/crazyshit/SettingsActivity.java \
            app/src/main/java/com/webapp/crazyshit/LandscapeMoreDialog.java \
            app/src/main/java/com/webapp/crazyshit/UiPalette.java \
            app/src/main/java/com/webapp/crazyshit/VideoDownloadStore.java \
            feedbackadmin/src/main/AndroidManifest.xml \
            feedbackadmin/src/main/java/com/addy37/crazyshitadmin/MainActivity.java \
            feedbackadmin/src/main/java/com/addy37/crazyshitadmin/AdminApplication.java; then
            echo "Stale public ZeroFilter branding was reintroduced."
            exit 1
          fi
          if grep -E -n 'baseBuilder\([^,]+, [^,]+, "ZF"\)|CrazyShit for Android|CrazyShit Beta|supported CrazyShit backup|yellow timeline|CrazyShit-Android' \
            app/src/main/java/com/webapp/crazyshit/NotificationCoordinator.java \
            app/src/main/java/com/webapp/crazyshit/BackupDocument.java \
            app/src/main/java/com/webapp/crazyshit/GestureGuideDialog.java \
            app/src/main/java/com/webapp/crazyshit/ContentUpdateWorker.java \
            app/src/main/java/com/webapp/crazyshit/MainActivity.java \
            README.md; then
            echo "Legacy public app branding was reintroduced."
            exit 1
          fi
          if grep -q -E 'splash_wordmark_transparent|splash_orange_glow' app/src/main/java/com/webapp/crazyshit/ChaosStartupOverlayController.java; then
            echo "Legacy startup overlay branding was reintroduced."
            exit 1
          fi
          if grep -q -E '251, 245, 6|FBF506' \
            app/src/main/java/com/webapp/crazyshit/StableBottomNavigationController.java \
            app/src/main/java/com/webapp/crazyshit/UiPolishController.java \
            app/src/main/java/com/webapp/crazyshit/LandscapeUiController.java \
            app/src/main/res/color/nav_icon_tint.xml \
            app/src/main/res/color/nav_text_tint.xml \
            app/src/main/res/color/nav_ripple.xml; then
            echo "Legacy yellow interaction styling was reintroduced."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Capture current Series and Categories artwork
        id: capture_art
        if: ${{ hashFiles('app/src/main/assets/browse_artwork.json') == '' }}
        run: |
          python3 -m pip install --quiet selenium pillow requests
          python3 tools/capture_browse_art.py
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import base64, io, json
          from PIL import Image, ImageOps

          with open('browse-art-bundle.json', 'r', encoding='utf-8') as f:
              bundle = json.load(f)

          mapping = {}
          for item in bundle.get('items', []):
              key = (item.get('key') or '').strip().lower()
              data = item.get('jpeg_base64') or ''
              if not key or not data:
                  continue
              raw = base64.b64decode(data)
              image = Image.open(io.BytesIO(raw)).convert('RGB')
              image = ImageOps.fit(image, (320, 180), method=Image.Resampling.LANCZOS, centering=(0.5, 0.45))
              out = io.BytesIO()
              image.save(out, 'JPEG', quality=68, optimize=True, progressive=True)
              mapping[key] = base64.b64encode(out.getvalue()).decode('ascii')

          with open('app/src/main/assets/browse_artwork.json', 'w', encoding='utf-8') as f:
              json.dump(mapping, f, separators=(',', ':'))
          print(f'Embedded {len(mapping)} browse card images')
          if len(mapping) < 75:
              raise SystemExit(f'Expected at least 75 embedded images, got {len(mapping)}')
          PY
          echo "captured=true" >> "$GITHUB_OUTPUT"

      - name: Save embedded artwork to branch
        if: ${{ steps.capture_art.outputs.captured == 'true' && github.event_name == 'pull_request' }}
        run: |
          cp app/src/main/assets/browse_artwork.json /tmp/browse_artwork.json
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          mkdir -p app/src/main/assets
          cp /tmp/browse_artwork.json app/src/main/assets/browse_artwork.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/browse_artwork.json
          git commit -m "Embed Series and Categories artwork [skip ci]"
          git push origin "${{ github.head_ref }}"

      - name: Upload browse artwork bundle
        continue-on-error: true
        if: ${{ steps.capture_art.outputs.captured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-browse-art
          path: browse-art-bundle.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android APIs 35 and 36
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Run focused Shows episode regressions first
        if: github.head_ref == 'feature/shows-episode-list'
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.ShowsEpisodeListTest'
          --tests 'com.webapp.crazyshit.PlaybackHistoryStoreTest'
          --tests 'com.webapp.crazyshit.VideoDetailProgressTest'
          --tests 'com.webapp.crazyshit.ShowsFullscreen*'

      - name: Run focused OnlyFap category shelf, hero, and preference regressions first
        if: github.head_ref == 'feature/onlyfap-gender-shelves'
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.OnlyFap*'
          --tests 'com.webapp.crazyshit.OnlyHaven*'
          --tests 'com.webapp.crazyshit.ContentPreferenceTest'
          --tests 'com.webapp.crazyshit.PrimaryTabWorkQueueTest'

      - name: Run supported source and preference search regressions first
        if: github.head_ref == 'feature/source-contracts-preference-search'
        env:
          VERIFY_PRODUCTION_SOURCE_CONFIG: 'true'
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.SourceConfigAgreementTest'
          --tests 'com.webapp.crazyshit.RemoteSourceConfigManagerTest'
          --tests 'com.webapp.crazyshit.SourceExpansionTest'
          --tests 'com.webapp.crazyshit.CreatorCategoryIndexTest'
          --tests 'com.webapp.crazyshit.FapzoneCreatorSearchRepositoryTest'
          --tests 'com.webapp.crazyshit.CreatorSuggestionsTest'
          --tests 'com.webapp.crazyshit.SearchPreferenceTest'
          --tests 'com.webapp.crazyshit.ContentPreferenceTest'
          --tests 'com.webapp.crazyshit.CreatorMergedGalleryTest'

      - name: Run native 5.1 preference and artwork regressions first
        if: github.head_ref == 'feature/zerochill-5.1.0'
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.ContentPreferenceTest'
          --tests 'com.webapp.crazyshit.PreferenceGlassPanelTest'
          --tests 'com.webapp.crazyshit.OnlyFapFilteredHeroTest'
          --tests 'com.webapp.crazyshit.OnlyFapHero*Test'
          --tests 'com.webapp.crazyshit.ShitTokPreferenceBufferTest'
          --tests 'com.webapp.crazyshit.OnlyHavenTrendingTest'
          --tests 'com.webapp.crazyshit.FavoriteArtworkFetchTest'
          --tests 'com.webapp.crazyshit.SettingsCompactSwitchTest'
          --tests 'com.webapp.crazyshit.OnlyFapFavoriteAvatarTest'
          --tests 'com.webapp.crazyshit.ShitTokCreatorBlockQueueIntegrationTest'
          --tests 'com.webapp.crazyshit.ChaosSourceMixerPriorityTest'
          --tests 'com.webapp.crazyshit.ShitTokContinuityTest'

      - name: Run search results and glass regressions first
        if: ${{ github.head_ref == 'feature/search-results-polish' }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.Search*Test'
          --tests 'com.webapp.crazyshit.CreatorSuggestionsTest'
          --tests 'com.webapp.crazyshit.FapzoneCreatorSearchRepositoryTest'
          --tests 'com.webapp.crazyshit.BundledCreatorIndexTest'
          --tests 'com.webapp.crazyshit.ShitTokCreatorSearchLearningTest'
          --tests 'com.webapp.crazyshit.VisualRefreshTest.searchResultsLeaveRoomForTheKeyboardAndOpenTheCreator'


      - name: Run focused BaddieHub title parsing first
        if: ${{ github.head_ref != 'feature/source-contracts-preference-search' && github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' && (github.head_ref == 'fix/baddiehub-view-count-titles') }}
        run: gradle --no-daemon :app:testDebugUnitTest --tests 'com.webapp.crazyshit.BaddieHubRepositoryTest'

      - name: Run related BaddieHub source and admission regressions
        if: ${{ github.head_ref != 'feature/source-contracts-preference-search' && github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' && (github.head_ref == 'fix/baddiehub-view-count-titles') }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.RemoteSourceConfigManagerTest'
          --tests 'com.webapp.crazyshit.ShowsHubStateTest'
          --tests 'com.webapp.crazyshit.ShowsHeroDesignTest'
          --tests 'com.webapp.crazyshit.ShitTokOrientationAdmissionTest'
          --tests 'com.webapp.crazyshit.ShitTokAspectPriorityTest'

      - name: Verify Library profile, account isolation and existing collections
        if: ${{ github.head_ref != 'feature/source-contracts-preference-search' && github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' && (github.head_ref != 'release/zerochill-5.0.0' && github.head_ref == 'feature/library-profile-redesign') }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.LibraryProfileTest'
          --tests 'com.webapp.crazyshit.LikedVideosActivityTest'
          --tests 'com.webapp.crazyshit.PrimaryTabLibraryTest'
          --tests 'com.webapp.crazyshit.LibrarySocialHubTest'
          --tests 'com.webapp.crazyshit.LibrarySearchTest'
          --tests 'com.webapp.crazyshit.PlaybackHistoryStoreTest'
          --tests 'com.webapp.crazyshit.ProfileAccountIsolationTest'
          --tests 'com.webapp.crazyshit.DownloadResumePolicyTest'
          --tests 'com.webapp.crazyshit.OnlyFapFavoriteAvatarTest'

      - name: Verify phone content grids and retained hub behavior
        if: ${{ github.head_ref != 'feature/source-contracts-preference-search' && github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' && (github.head_ref != 'release/zerochill-5.0.0' && github.head_ref == 'feature/phone-content-grid-layout') }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.PhoneContentGridLayoutTest'
          --tests 'com.webapp.crazyshit.ShowsHeroDesignTest'
          --tests 'com.webapp.crazyshit.ShowsHubStateTest'
          --tests 'com.webapp.crazyshit.OnlyFapHeroDesignTest'
          --tests 'com.webapp.crazyshit.OnlyFapHeroStartupTest'
          --tests 'com.webapp.crazyshit.OnlyFapDiscoverLifecycleTest'
          --tests 'com.webapp.crazyshit.OnlyFapFavoriteAvatarTest'

      - name: Verify OnlyFap progressive first-open readiness
        if: ${{ github.head_ref != 'feature/source-contracts-preference-search' && github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' && (github.head_ref != 'release/zerochill-5.0.0' && github.head_ref == 'fix/onlyfap-first-open') }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.ColdTabSnapshotTest'
          --tests 'com.webapp.crazyshit.OnlyFapHeroStartupTest'
          --tests 'com.webapp.crazyshit.OnlyFapDiscoverLifecycleTest'
          --tests 'com.webapp.crazyshit.OnlyFapFavoriteAvatarTest'
          --tests 'com.webapp.crazyshit.PrimaryTab*'

      - name: Run focused OnlyFap Library regressions first
        if: ${{ github.head_ref != 'feature/source-contracts-preference-search' && github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' && (github.head_ref == 'fix/library-onlyfap-creator-context') }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.OnlyFapLibrary*Test'
          --tests 'com.webapp.crazyshit.PlaybackHistoryStoreTest'
          --tests 'com.webapp.crazyshit.CreatorBackupTest'
          --tests 'com.webapp.crazyshit.LibraryProfileTest'
          --tests 'com.webapp.crazyshit.LibrarySocialHubTest'
          --tests 'com.webapp.crazyshit.PrimaryTabLibraryTest'
          --tests 'com.webapp.crazyshit.SocialContentNavigationTest'
          --tests 'com.webapp.crazyshit.DownloadResumePolicyTest'
          --tests 'com.webapp.crazyshit.VideoDetailProgressTest'
          --tests 'com.webapp.crazyshit.FapelloRepositoryTest'
          --tests 'com.webapp.crazyshit.ShitTokSwipeStartTest'

      - name: Run focused ShitTok creator handoff regressions first
        if: ${{ github.head_ref != 'feature/search-results-polish' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.ShitTokCreatorGalleryHandoffTest'
          --tests 'com.webapp.crazyshit.ShitTokCreatorSearchLearningTest'
          --tests 'com.webapp.crazyshit.ShitTokSwipeStartTest'
          --tests 'com.webapp.crazyshit.FapzoneCreatorSearchRepositoryTest'
          --tests 'com.webapp.crazyshit.CreatorNameMatcherTest'
          --tests 'com.webapp.crazyshit.FapelloRepositoryTest'
          --tests 'com.webapp.crazyshit.HomeSourceTest'
          --tests 'com.webapp.crazyshit.NotificationCoordinatorFormattingTest'
          --tests 'com.webapp.crazyshit.ShitTokCreatorMetadataTest'
          --tests 'com.webapp.crazyshit.ShitTokCreatorMetadataLoaderTest'
          --tests 'com.webapp.crazyshit.ChaosSourceMixerPriorityTest'
          --tests 'com.webapp.crazyshit.ShitTokAspectPriorityTest'
          --tests 'com.webapp.crazyshit.CreatorMergedGalleryTest'

      - name: Verify ShitTok interaction boundaries
        if: ${{ github.head_ref != 'feature/source-contracts-preference-search' && github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' && (github.head_ref != 'release/zerochill-5.0.0') }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests com.webapp.crazyshit.ShitTokInteractionPolicyTest
          --tests com.webapp.crazyshit.ShitTokScrubPreviewTest
          --tests com.webapp.crazyshit.ShitTokInteractionUiTest
          --tests com.webapp.crazyshit.ShitTokProgressTest
          --tests com.webapp.crazyshit.ShitTokDynamicPinchTest

      - name: Verify ShitTok continuity without weakening rebuffer protection
        if: ${{ github.head_ref != 'feature/source-contracts-preference-search' && github.head_ref != 'feature/zerochill-5.1.0' && github.head_ref != 'feature/search-results-polish' && github.head_ref != 'fix/library-startup-navigation' && github.head_ref != 'feature/shows-episode-list' && github.head_ref != 'feature/onlyfap-gender-shelves' && (github.head_ref != 'release/zerochill-5.0.0') }}
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests com.webapp.crazyshit.ShitTokContinuityTest
          --tests com.webapp.crazyshit.ShitTokStartupPreparationTest
          --tests com.webapp.crazyshit.ChaosStartupPreloaderTest
          --tests com.webapp.crazyshit.PrimaryTabLibraryTest
          --tests com.webapp.crazyshit.PrimaryTabNavigationTest
          --tests com.webapp.crazyshit.ShitTokCreatorMetadataLoaderTest
          --tests com.webapp.crazyshit.ShitTokCreatorMetadataTest
          --tests com.webapp.crazyshit.ShitTokRunwayPolicyTest
          --tests com.webapp.crazyshit.ShitTokInventoryAdmissionTest
          --tests com.webapp.crazyshit.ShitTokLoadingStateTest
          --tests com.webapp.crazyshit.ChaosStarterSourcesTest
          --tests com.webapp.crazyshit.ShitTokBufferOwnerTest
          --tests com.webapp.crazyshit.ShitTokBufferLoadControlTest

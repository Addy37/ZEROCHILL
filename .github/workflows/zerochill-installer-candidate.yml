name: ZEROCHILL Installer Signed Beta
on:
  push:
    branches: [feature/zerochill-safe-installer-beta]
    paths: [.github/workflows/zerochill-installer-candidate.yml]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_VERSION_CODE: '7002001'
      APP_VERSION_NAME: '7.2.1-installer-beta.1'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check approved release lineage
        run: |
          git merge-base --is-ancestor 20e4fd47dc7f23873ece2c3f1ff735b3f85b4bf0 HEAD
          git merge-base --is-ancestor a1c051f34d7b89ed104db924b0d45c24596eb0c0 HEAD
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android APIs
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Restore production signing identity
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib
          raw=os.environ.get('SIGNING_BUNDLE','')
          if not raw: raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data=json.loads(raw.replace('\r','').replace('\n',''))
          for key in ('keystore_base64','store_password','key_alias','key_password'):
              if not data.get(key): raise SystemExit('Missing signing item '+key)
          for key in ('store_password','key_alias','key_password'):
              print('::add-mask::'+data[key])
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'installer-beta.jks'
          path.write_bytes(base64.b64decode(data['keystore_base64']))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for k,v in {'ANDROID_KEYSTORE_PATH':str(path),
                          'ANDROID_KEYSTORE_PASSWORD':data['store_password'],
                          'ANDROID_KEY_ALIAS':data['key_alias'],
                          'ANDROID_KEY_PASSWORD':data['key_password']}.items():
                  out.write(k+'='+v+'\n')
          PY
      - name: Focused updater tests and signed release assembly
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:testReleaseUnitTest
          --tests '*AppUpdaterInstallerTest'
          --tests '*UpdateCardControllerTest'
          :app:assembleRelease
      - name: Confirm upgrade identity, permissions and backend isolation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate "$RUNNER_TEMP/stable"
          gh release download v7.2.0 --repo "$GITHUB_REPOSITORY" --pattern ZeroChill.apk --dir "$RUNNER_TEMP/stable"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          CANDIDATE="candidate/ZeroChill-${APP_VERSION_NAME}-${SAFE_BRANCH}-${GITHUB_SHA:0:7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$CANDIDATE"
          export CANDIDATE
          python3 - <<'PY'
          import os,pathlib,re,subprocess
          bt=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          def run(*args):return subprocess.check_output(args,text=True)
          def inspect(path):
              dump=run(str(bt/'aapt2'),'dump','badging',path)
              hit=re.search(r"package: name='([^']+)' versionCode='(\d+)'",dump)
              assert hit,'No package/version metadata'
              certs=run(str(bt/'apksigner'),'verify','--print-certs',path)
              cert=re.search(r'Signer #1 certificate SHA-256 digest: ([a-f0-9]+)',certs)
              assert cert,'No signing certificate'
              return hit[1],int(hit[2]),cert[1]
          now=inspect(os.environ['CANDIDATE'])
          old=inspect(str(pathlib.Path(os.environ['RUNNER_TEMP'])/'stable/ZeroChill.apk'))
          assert now[0]==old[0]=='com.addy37.crazyshitunofficial'
          assert now[1]==7002001 and old[1]==7002000
          assert now[2]==old[2]=='04abf84b3d468cbb1a562dea83b0007e686b2e56018cce911223963faea51356'
          permissions=run(str(bt/'aapt2'),'dump','permissions',os.environ['CANDIDATE'])
          assert 'android.permission.REQUEST_INSTALL_PACKAGES' in permissions
          generated=pathlib.Path('app/build/generated/source/buildConfig/release/com/webapp/crazyshit/BuildConfig.java').read_text()
          assert 'ZEROCHILL_V7_TRAFFIC = true;' in generated
          assert 'https://aavjpykssueavbseqdlf.supabase.co' in generated
          assert 'ANALYTICS_ENDPOINT = "";' in generated and 'ANALYTICS_V2_ENDPOINT = "";' in generated
          assert os.environ['GITHUB_SHA'] in generated
          report='Source: '+os.environ['GITHUB_SHA']+'\nBranch: '+os.environ['GITHUB_REF_NAME']+'\nPackage: '+now[0]+'\nVersion: '+str(now[1])+'\nCertificate: '+now[2]+'\nSigned upgrade/permissions/backend checks passed.\nNo public release. Phone Play Protect/installer test required.\n'
          pathlib.Path('candidate/VALIDATION.txt').write_text(report)
          print(report)
          PY
          cp docs/SAFE_INSTALLER_BETA.md candidate/TEST_INSTRUCTIONS.md
          cp -r app/build/test-results/testReleaseUnitTest candidate/update-test-results
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ZEROCHILL-installer-beta-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14

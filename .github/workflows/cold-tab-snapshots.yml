name: Cold tab snapshots focused validation
on:
  push:
    branches: [feature/cold-tab-snapshots]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Focused snapshot and warm tab tests
        run: >-
          gradle --no-daemon :app:testDebugUnitTest
          --tests 'com.webapp.crazyshit.ColdTabSnapshotTest'
          --tests 'com.webapp.crazyshit.OnlyFapDiscoverLifecycleTest'
          --tests 'com.webapp.crazyshit.ShowsHubStateTest'
      - name: Debug build
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-tab-snapshot-validation
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/outputs/apk/debug/*.apk

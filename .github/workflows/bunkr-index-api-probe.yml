name: Bunkr Index API Read-Only Probe
# Isolated API contract check. No APK builds, credentials, media downloads or releases.
on:
  push:
    branches:
      - experiment/bunkr-index-api-2026-11
    paths:
      - .github/workflows/bunkr-index-api-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-index:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe documented statistics and candidate search responses
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import time
          from urllib.parse import urlparse

          BASE = 'https://bunkrsearch.link'
          # Search path is a candidate, not a verified contract.
          PATHS = [
              '/about',
              '/api/stats',
              '/api/search?q=sample&limit=1',
              '/search?q=sample'
          ]

          def shape(data):
              if isinstance(data, dict):
                  return {key: type(value).__name__ for key, value in list(data.items())[:25]}
              if isinstance(data, list):
                  return {'type': 'list', 'length': len(data),
                          'first_item_keys': list(data[0].keys())[:25]
                          if data and isinstance(data[0], dict) else []}
              return {'type': type(data).__name__}

          for path in PATHS:
              req = urllib.request.Request(
                  BASE + path,
                  headers={'User-Agent': 'ZeroChill-API-Contract-Check/1.0',
                           'Accept': 'application/json,text/html;q=0.8'},
                  method='GET')
              out = {'path': path}
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      out['http'] = response.status
                      out['final_path'] = response.geturl().removeprefix(BASE)
                      out['content_type'] = response.headers.get('Content-Type', '')
                      body = response.read(65536)
                      try:
                          payload = json.loads(body)
                          out['json_shape'] = shape(payload)
                          if path.startswith('/api/search') and isinstance(payload, dict):
                              results = payload.get('results', [])
                              out['result_count'] = len(results) if isinstance(results, list) else -1
                              if isinstance(results, list) and results and isinstance(results[0], dict):
                                  out['first_result_fields'] = shape(results[0])
                                  for field, value in results[0].items():
                                      if isinstance(value, str) and value.startswith(('https://', 'http://')):
                                          parsed = urlparse(value)
                                          out.setdefault('url_fields', {})[field] = {
                                              'host': parsed.hostname,
                                              'is_bunkr_album': parsed.path.startswith('/a/')
                                          }
                      except (ValueError, UnicodeDecodeError):
                          out['html_or_text_response'] = True
                          out['has_search_form'] = b'<form' in body.lower()
              except urllib.error.HTTPError as error:
                  out['http'] = error.code
                  out['content_type'] = error.headers.get('Content-Type', '')
              except Exception as error:
                  out['network_error_class'] = type(error).__name__
              print(json.dumps(out, sort_keys=True), flush=True)
              time.sleep(0.3)
          PY

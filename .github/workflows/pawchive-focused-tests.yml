name: Pawchive focused integration tests
on:
  push:
    branches:
      - feature/pawchive-onlyfap
    paths:
      - 'app/src/**/Pawchive*.java'
      - '.github/workflows/pawchive-focused-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Test Pawchive API contracts without contacting the provider
        run: gradle --no-daemon --console=plain --max-workers=3 :app:testDebugUnitTest --tests com.webapp.crazyshit.PawchiveRepositoryTest

name: ZEROCHILL Installer Remote Update End to End Test

# Runs once on the feature branch after implementation is ready.
# Publishes ONLY an explicit prerelease asset, never a stable release/latest.
on:
  push:
    branches:
      - feature/zerochill-safe-installer-beta
    paths:
      - .github/workflows/zerochill-installer-remote-e2e.yml

permissions:
  contents: write

jobs:
  signed-e2e-test:
    if: github.ref_name == 'feature/zerochill-safe-installer-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_VERSION_CODE: '7002004'
      APP_VERSION_NAME: '7.2.1-installer-e2e.4'
      ZEROCHILL_SOURCE_SHA: ${{ github.sha }}
      ZEROCHILL_V7_TRAFFIC: 'true'
      SUPABASE_URL: https://aavjpykssueavbseqdlf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ANON_KEY: sb_publishable_oSQALszxzeeHxDwEeclucA_5dGEpOLs
      FEEDBACK_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/dynamic-api
      SOURCE_CONFIG_ENDPOINT: https://aavjpykssueavbseqdlf.supabase.co/functions/v1/app-config
      ANALYTICS_ENDPOINT: ''
      ANALYTICS_V2_ENDPOINT: ''
      TEST_TAG: v7.2.1-installer-e2e.5

    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gate approved history and isolated test configuration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 20e4fd47dc7f23873ece2c3f1ff735b3f85b4bf0 HEAD
          git merge-base --is-ancestor a4b7979e75cb1970ac96e0c50153bba46646e089 HEAD
          git merge-base --is-ancestor 82f961c8513d7ca5e57db1f28dc99cfab29f93ee HEAD
          grep -q '"Check installer test update"' app/src/main/java/com/webapp/crazyshit/SettingsActivity.java
          test -f docs/SAFE_INSTALLER_BETA.md
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android APIs
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Restore existing production signing identity
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib
          raw=os.environ.get('SIGNING_BUNDLE','')
          if not raw: raise SystemExit('Missing ANDROID_SIGNING_BUNDLE')
          data=json.loads(raw.replace('\r','').replace('\n',''))
          for key in ('keystore_base64','store_password','key_alias','key_password'):
              if not data.get(key): raise SystemExit('Missing signing item: '+key)
          for key in ('store_password','key_alias','key_password'):
              print('::add-mask::'+data[key])
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'installer-e2e.jks'
          path.write_bytes(base64.b64decode(data['keystore_base64']))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              for k,v in {
                  'ANDROID_KEYSTORE_PATH':str(path),
                  'ANDROID_KEYSTORE_PASSWORD':data['store_password'],
                  'ANDROID_KEY_ALIAS':data['key_alias'],
                  'ANDROID_KEY_PASSWORD':data['key_password']
              }.items():out.write(k+'='+v+'\n')
          PY
      - name: Run focused updater tests and assemble signed harness
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:testReleaseUnitTest
          --tests '*AppUpdaterInstallerTest'
          --tests '*UpdateCardControllerTest'
          :app:assembleRelease
      - name: Save harness APK
        run: |
          set -euo pipefail
          mkdir -p candidate
          BRANCH="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk \
            "candidate/ZeroChill-7.2.1-installer-e2e.4-${BRANCH}-${GITHUB_SHA:0:7}.apk"
      - name: Assemble the higher-version signed test update
        env:
          APP_VERSION_CODE: '7002005'
          APP_VERSION_NAME: '7.2.1-installer-e2e.5'
        run: >-
          gradle --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64
          :app:assembleRelease
      - name: Save exact remote update asset
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk \
            candidate/ZeroChill-installer-e2e-test.apk
      - name: Verify signatures, upgrade order, version and backend isolation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "v7.2.0"
          mkdir -p "$RUNNER_TEMP/stable"
          gh release download v7.2.0 --repo "$GITHUB_REPOSITORY" \
            --pattern ZeroChill.apk --dir "$RUNNER_TEMP/stable"
          python3 - <<'PY'
          import glob,os,pathlib,re,subprocess
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools/35.0.0'
          def run(*args):
              return subprocess.check_output(args,text=True)
          def examine(path):
              badging=run(str(tools/'aapt2'),'dump','badging',path)
              match=re.search(r"package: name='([^']+)' versionCode='(\d+)'",badging)
              assert match, 'Missing package or version'
              signer=run(str(tools/'apksigner'),'verify','--print-certs',path)
              cert=re.search(r'Signer #1 certificate SHA-256 digest: ([a-f0-9]+)',signer)
              assert cert,'Unsigned APK'
              return match[1],int(match[2]),cert[1]
          public=examine(str(pathlib.Path(os.environ['RUNNER_TEMP'])/'stable/ZeroChill.apk'))
          harnessFiles=glob.glob('candidate/ZeroChill-7.2.1-installer-e2e.4-*.apk')
          fixture='candidate/ZeroChill-installer-e2e-test.apk'
          assert len(harnessFiles)==1,'Must have exactly one harness'
          assert pathlib.Path(fixture).is_file(),'Missing fixture'
          harness=examine(harnessFiles[0])
          target=examine(fixture)
          assert public[0]==harness[0]==target[0]=='com.addy37.crazyshitunofficial','Wrong application ID'
          assert (public[1],harness[1],target[1])==(7002000,7002004,7002005),'Wrong versions'
          assert public[2]==harness[2]==target[2]=='04abf84b3d468cbb1a562dea83b0007e686b2e56018cce911223963faea51356','Signing changed'
          for path in [harnessFiles[0],fixture]:
              permissions=run(str(tools/'aapt2'),'dump','permissions',path)
              assert 'android.permission.REQUEST_INSTALL_PACKAGES' in permissions,'Installer permission absent'
          generated=pathlib.Path('app/build/generated/source/buildConfig/release/com/webapp/crazyshit/BuildConfig.java').read_text()
          assert 'ZEROCHILL_V7_TRAFFIC = true;' in generated, 'V7 traffic disabled'
          assert 'https://aavjpykssueavbseqdlf.supabase.co' in generated, 'Wrong backend'
          assert 'ANALYTICS_ENDPOINT = "";' in generated and 'ANALYTICS_V2_ENDPOINT = "";' in generated, 'Old analytics'
          assert os.environ['GITHUB_SHA'] in generated,'Source SHA incorrect'
          report=('Verified source: '+os.environ['GITHUB_SHA']+
              '\nBranch: '+os.environ['GITHUB_REF_NAME']+
              '\nPackage: '+harness[0]+
              '\nVersions: 7002004 -> 7002005'+
              '\nCertificate: '+harness[2]+
              '\nSigned harness and test asset verified. Normal stable latest unchanged.'+
              '\nNo phone test run yet. No stable release, merge, backend or data migration.\n')
          pathlib.Path('candidate/VALIDATION.txt').write_text(report)
          print(report)
          PY
          (cd candidate && sha256sum ZeroChill-installer-e2e-test.apk > SHA256SUMS.txt)
          cp docs/SAFE_INSTALLER_BETA.md candidate/TEST_INSTRUCTIONS.md
          cp -r app/build/test-results/testReleaseUnitTest candidate/update-test-results
      - name: Upload one private signed test pair as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZEROCHILL-installer-remote-e2e-${{ github.sha }}
          path: candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Publish ONLY isolated installer test prerelease, never latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to replace existing test prerelease"
            exit 1
          fi
          printf 'TEST ONLY. ZEROCHILL installer check, not a stable app update.\n\n' > candidate/TEST_RELEASE_NOTES.md
          printf 'For the opt-in installer-e2e.4 harness only. Do not install manually. This test prerelease is public on GitHub, but not in the production app update feed.\n' >> candidate/TEST_RELEASE_NOTES.md
          gh release create "$TEST_TAG" \
            candidate/ZeroChill-installer-e2e-test.apk \
            candidate/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ZEROCHILL installer test (NOT stable)" \
            --notes-file candidate/TEST_RELEASE_NOTES.md \
            --prerelease --latest=false
      - name: Verify public test endpoint without changing stable latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "v7.2.0"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TEST_TAG}" --jq '.prerelease')" = "true"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TEST_TAG}" --jq '.draft')" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TEST_TAG}" --jq '.assets[].name' | grep -x 'ZeroChill-installer-e2e-test.apk')" = 'ZeroChill-installer-e2e-test.apk'
          gh release view "$TEST_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,isLatest

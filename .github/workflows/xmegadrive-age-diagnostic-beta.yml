name: Build XMegaDrive Age Diagnostic Beta

on:
  push:
    branches:
      - feature/zerochill-notifications-5.3.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2dac4914663ac2297e62977fec4a116a9c804773

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Verify value-free diagnostic
        run: |
          grep -q 'XMegaDriveAgeDiagnostics.captureBefore' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          grep -q 'XMegaDriveAgeDiagnostics.captureAfterAndShow' app/src/main/java/com/webapp/crazyshit/XMegaDriveBrowserFetch.java
          grep -q 'Values were not included' app/src/main/java/com/webapp/crazyshit/XMegaDriveAgeDiagnostics.java

      - name: Run focused XMegaDrive tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.XMegaDriveAgeDiagnosticsTest --tests com.webapp.crazyshit.XMegaDriveAgeGateSafetyTest --tests com.webapp.crazyshit.XMegaDriveAgePromptTest

      - name: Build debug beta
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename beta
        run: cp app/build/outputs/apk/debug/app-debug.apk ZeroChill-2dac491-XMegaDrive-Age-Diagnostic-Beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroChill-XMegaDrive-Age-Diagnostic-Beta
          path: ZeroChill-2dac491-XMegaDrive-Age-Diagnostic-Beta.apk
          retention-days: 7
